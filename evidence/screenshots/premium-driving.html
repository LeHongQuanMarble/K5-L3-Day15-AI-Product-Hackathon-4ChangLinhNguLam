e txt=\"C\u1ed1 g\u1eafng luy\u1ec7n t\u1eadp th\u00eam nh\u00e9!\";\n    g.innerHTML=`<div class=\"jl-screen jl-fadein\">\n      <h2 style=\"font-size:2rem;margin-bottom:6px;\">K\u1ebeT TH\u00daC!<\/h2>\n      <div style=\"font-size:1.25rem;text-align:center;margin-bottom:11px;\">\u0110i\u1ec3m c\u1ee7a b\u1ea1n: <b>${score}/${questions.length}<\/b><\/div>\n      <div style=\"font-size:1.1rem;color:#ebf6ff;text-align:center;\">${txt}<\/div>\n      <button class=\"jl-btn\" id=\"btnRestart\" tabindex=\"0\" autofocus>Ch\u01a1i l\u1ea1i<\/button>\n    <\/div>`;\n    document.getElementById(\"btnRestart\").onclick=startGame;\n  }\n}\nfunction progress(){\n  return `<div class=\"progressbar\" aria-label=\"Ti\u1ebfn tr\u00ecnh\"><div class=\"progressbar-inner\" style=\"width:${(qidx)/questions.length*100}%\"><\/div><\/div>`;\n}\nfunction carSVG(nitro=false){\n  // Xe nh\u1ecf v\u1ebd SVG \u2014 m\u00e0u/s\u00e1ng thay \u0111\u1ed5i khi nitro\nreturn `<svg viewBox=\"0 0 72 54\" style=\"border-radius:9px;\">\n<rect width=\"72\" height=\"25\" y=\"16\" rx=\"12\" fill=\"${nitro?'#29ffe0':'#6acef5'}\"/>\n<ellipse cx=\"36\" cy=\"28\" rx=\"34\" ry=\"10\" fill=\"#46a8db\" opacity=\".22\"/>\n<rect width=\"36\" height=\"10\" x=\"18\" y=\"8\" rx=\"6\" fill=\"#aacbfa\"/>\n<rect width=\"16\" height=\"10\" x=\"36\" y=\"8\" rx=\"5\" fill=\"#ffd354\" fill-opacity=\".85\"/>\n<rect width=\"16\" height=\"10\" x=\"20\" y=\"8\" rx=\"6\" fill=\"#ffd354\" fill-opacity=\".44\"/>\n<ellipse cx=\"25\" cy=\"44\" rx=\"7\" ry=\"6\" fill=\"#222\"/>\n<ellipse cx=\"47\" cy=\"44\" rx=\"7\" ry=\"6\" fill=\"#222\"/>\n${nitro?'<rect x=\"28\" y=\"48\" width=\"16\" height=\"5\" rx=\"3\" fill=\"#29ffe0\" filter=\"url(#glow)\"/><defs><filter id=\"glow\"><feGaussianBlur in=\"SourceGraphic\" stdDeviation=\"1.3\" result=\"blur\"/><\/filter><\/defs>':''}\n<\/svg>`;\n}\nfunction drawGame(){\n  let g=document.getElementById(\"game\"),q=questions[qidx];\n  let lanesDom = q.choices.map((c,li)=>`\n   <div class=\"lane-opt
