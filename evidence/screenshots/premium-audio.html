ifr.srcdoc = "<!doctype html>\n<html lang=\"vi\">\n<head><meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src data: blob:; media-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'\"><script>(function(){\n/* Helper c\u1ee7a AI Lab: v\u1ebd \u1ea3nh camera v\u00e0o m\u1ecdi ph\u1ea7n t\u1eed [data-jl-camera]; ch\u1ec9 xin \u1ea3nh khi c\u00f3 \u00f4 \u0111ang hi\u1ec7n. */\nvar boxes=new Map();\nfunction sync(){\n  document.querySelectorAll('[data-jl-camera]').forEach(function(el){\n    if(!boxes.has(el)){var c=document.createElement('canvas');el.appendChild(c);boxes.set(el,c);}\n  });\n  var any=false;boxes.forEach(function(c,el){if(!el.isConnected){boxes.delete(el);return;}\n    var r=el.getBoundingClientRect();if(r.width>0&&r.height>0&&getComputedStyle(el).display!=='none')any=true;});\n  parent.postMessage({type:'camera.want',on:any},'*');\n}\nfunction draw(bmp){\n  boxes.forEach(function(c,el){var r=el.getBoundingClientRect();if(!r.width||!r.height)return;\n    if(c.width!==bmp.width||c.height!==bmp.height){c.width=bmp.width;c.height=bmp.height;}\n    c.getContext('2d').drawImage(bmp,0,0);});\n  bmp.close&&bmp.close();\n}\nfunction note(el,txt){boxes.forEach(function(c,e){if(!e.querySelector('.jl-note')){var n=document.createElement('div');n.className='jl-note';\n  n.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:14px system-ui;text-align:center;padding:8px';\n  if(getComputedStyle(e).position==='static')e.style.position='relative';e.appendChild(n);}e.querySelector('.jl-note').textContent=txt;});}\nwindow.addEventListener('message',function(e){var d=e.data;if(!d||e.source!==parent)return;\n  if(d.type==='camera.image'&&d.image)draw(d.image);\n  if(d.type==='camera.status'){var m={denied:'Ch\u01b0a \u0111\u01b0\u1ee3c c\u1ea5p quy\u1ec1n camera',busy:'Camera \u0111ang b\u1eadn','no-camera':'Kh\u00f4ng th\u1ea5y camera','model-failed':'Kh\u00f4ng n\u1ea1p \u0111\u01b0\u1ee3c m\u00f4 h\u00ecnh',off:'Camera \u0111\u00e3 t\u1eaft',loading:'\u0110ang b\u1eadt camera\u2026',ready:''}[d.state];\n    if(m!==undefined)note(null,m);}\n});\nnew MutationObserver(sync).observe(document.documentElement,{childList:true,subtree:true,attributes:true});\ndocument.addEventListener('DOMContentLoaded',sync);setInterval(sync,1000);\n})();<\/script>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <title>Quiz H\u1ec7 M\u1eb7t Tr\u1eddi<\/title>\n  <script type=\"application/json\" id=\"jl-camera\">\n  {\"name\": \"Quiz H\u1ec7 M\u1eb7t Tr\u1eddi\", \"description\": \"Tr\u00f2 ch\u01a1i s\u1ebd h\u1ecfi c\u00e1c c\u00e2u h\u1ecfi v\u1ec1 H\u1ec7 M\u1eb7t Tr\u1eddi v\u00e0 h\u1ecdc sinh tr\u1ea3 l\u1eddi b\u1eb1ng c\u00e1ch ph\u00e1t \u00e2m A, B, C, D th\u00f4ng qua micro.\", \"kinds\": [\"audio\"], \"inputs\": [{\"key\": \"a\", \"label\": \"A\", \"required\": true, \"accepts\": [\"action\"]}, {\"key\": \"b\", \"label\": \"B\", \"required\": true, \"accepts\": [\"action\"]}, {\"key\": \"c\", \"label\": \"C\", \"required\": true, \"accepts\": [\"action\"]}, {\"key\": \"d\", \"label\": \"D\", \"required\": true, \"accepts\": [\"action\"]}], \"questions\": \"exam\"}\n  <\/script>\n  <style>\n    html,body{height:100%;margin:0;padding:0}\n    body{height:100vh;margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#072943 0%,#123065 100%);}\n    .jl-fadein{animation:fadeIn .4s}\n    @keyframes fadeIn{from{opacity:0}to{opacity:1}}\n    main{max-width:480px;margin:0 auto;padding:0 10px 40px 10px;}\n    .jl-screen{display:flex;flex-direction:column;min-height:80vh;justify-content:center;align-items:center;text-align:center}\n    .jl-title{font-size:2.2em;letter-spacing:0.04em;margin:32px 0 8px 0;font-weight:800;color:#ffdf82;text-shadow:1px 2px 6px #024}\n    .jl-desc{font-size:1.19em;margin:7px 0 23px 0;color:#fff6}\n    .jl-btn{display:inline-block;background:linear-gradient(90deg,#ffaa17 0,#ffd04a 90%);color:#1c2331;font-weight:700;font-size:1.22em;padding:18px 0 14px 0;width:78vw;max-width:300px;margin:22px auto 0 auto;border:none;border-radius:999px;box-shadow:0 2px 12px #1236;cursor:pointer;transition:.15s;outline:none}\n    .jl-btn:active{transform:scale(.96);}\n    .sun-bg{position:fixed;left:0;right:0;top:0;bottom:0;overflow:hidden;pointer-events:none;z-index:-1}\n    .jl-complete{font-size:1.35em;margin:30px 0 8px 0;color:#ffecb3}\n    .jl-score{font-size:2.2em;color:#48e979;margin-bottom:8px;font-weight:800}\n    .jl-q-card{background:rgba(29,52,95,0.88);box-shadow:0 2px 20px 4px #2455  ;border-radius:22px;padding:1.2em 0 1em 0;margin:26px 0;min-height:90px;position:relative}\n    .jl-qtext{font-size:1.29em;line-height:1.25em;padding:10px 18px 10px 18px;font-weight:600;}\n    .jl-opt{font-size:1.22em;line-height:2.8rem;border-radius:12px;margin:12px 0;background:#232b49cc;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:left;min-height:56px;box-shadow:0 1px 7px #0002;transition:background 0.2s, box-shadow 0.2s;cursor:pointer;position:relative;}\n    .jl-opt b{font-size:1em;display:inline-block;width:3.1em;margin-left:18px;}\n    .jl-opt:active{background:#2a3f6d}\n    .jl-opt.is-good{background:linear-gradient(90deg,#33d687 0,#a8ffc8 100%);color:#143c1c!important;box-shadow:0 0 0 3px #31c77a70;}\n    .jl-opt.is-bad{background:linear-gradient(90deg,#fa5958,#fec8c8 80%);color:#610a1a!important;box-shadow:0 0 0 3px #fd585820;}\n    .jl-q-card .jl-icon{position:absolute;right:23px;top:23px;font-size:2.0em;opacity:.88}\n    .jl-progress{height:6px;background:#fff2;border-radius:8px;width:100%;margin:0 0 12px 0;}\n    .jl-progress-bar{background:linear-gradient(90deg,#ffd100 0,#fe7 100%);height:100%;border-radius:8px}\n    .jl-solar{display:flex;justify-content:center;align-items:center;margin:26px 0}\n    .planet{width:30px;height:30px;border-radius:50%;margin:0 7px 0 0;display:inline-block;box-shadow:0 1px 6px 2px #0018}\n    .p-mer{background:#fddeb3}\n    .p-ven{background:#f8b537}\n    .p-ear{background:#48d5e9}\n    .p-mar{background:#e65643}\n    .p-jup{background:#eabe93}\n    .p-sat{background:#ffe282}\n    .p-ura{background:#88e2f7}\n    .p-nep{background:#3b6dfb}\n    .p-sun{background:radial-gradient(circle at 32% 38%,#fff492 0 27%,#ffe65c 33% 66%,#efbf19 100%)}\n    .jl-keymap{margin-top:5px;color:#fff5;font-size:.98em}\n    @media (max-width:520px){\n      .jl-title{font-size:1.45em;}\n      .jl-score{font-size:1.38em}\n      .jl-btn{font-size:1.07em;padding:13px 0 10px 0;width:90vw;max-width:99vw;margin:14px 0 0 0;}\n      main{padding:0 2vw 32vw 2vw;}\n      .jl-opt b{margin-left:7px;}\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"sun-bg\">\n    <!-- Sun + planets as decorative SVG/CSS -->\n    <svg width=\"100%\" height=\"240\" viewBox=\"0 0 420 120\">\n      <circle cx=\"65\" cy=\"60\" r=\"32\" fill=\"url(#sun)\" />\n      <defs>\n        <radialGradient id=\"sun\">\n          <stop offset=\"0%\" stop-color=\"#fff492\"/>\n          <stop offset=\"60%\" stop-color=\"#ffe85f\"/>\n          <stop offset=\"100%\" stop-color=\"#efbc10\"/>\n        <\/radialGradient>\n      <\/defs>\n      <circle cx=\"125\" cy=\"84\" r=\"9.5\" fill=\"#fddeb3\" opacity=\"0.92\"/>\n      <circle cx=\"157\" cy=\"62\" r=\"11\" fill=\"#f8b537\" opacity=\"0.87\"/>\n      <circle cx=\"200\" cy=\"55\" r=\"12\" fill=\"#48d5e9\" opacity=\"0.7\"/>\n      <circle cx=\"242\" cy=\"57\" r=\"12.5\" fill=\"#e65643\" opacity=\"0.7\"/>\n      <circle cx=\"298\" cy=\"94\" r=\"20\" fill=\"#eabe93\" opacity=\"0.76\"/>\n      <circle cx=\"347\" cy=\"85\" r=\"17\" fill=\"#ffe282\" opacity=\"0.72\"/>\n      <circle cx=\"386\" cy=\"63\" r=\"14\" fill=\"#88e2f7\" opacity=\"0.60\"/>\n      <circle cx=\"413\" cy=\"54\" r=\"12\" fill=\"#3b6dfb\" opacity=\"0.6\"/>\n    <\/svg>\n  <\/div>\n  <main id=\"main\"><\/main>\n  <div data-jl-camera style=\"position:fixed;top:11px;right:11px;width:123px;height:92px;z-index:10;border-radius:16px;overflow:hidden;background:#0008;box-shadow:0 0 16px #fff1\"><\/div>\n<script>\n(function(){\n'use strict';\n\nconst DEMO = [\n  {id:\"1\",type:\"single\",text:\"H\u00e0nh tinh n\u00e0o g\u1ea7n M\u1eb7t Tr\u1eddi nh\u1ea5t?\",choices:[\n    {key:\"a\",text:\"Sao Th\u1ee7y\"}, // \u0110\n    {key:\"b\",text:\"Sao Kim\"},\n    {key:\"c\",text:\"Sao H\u1ecfa\"},\n    {key:\"d\",text:\"Sao H\u1ea3i V\u01b0\u01a1ng\"}\n  ],answer:\"a\"},\n  {id:\"2\",type:\"single\",text:\"H\u00e0nh tinh l\u1edbn nh\u1ea5t trong H\u1ec7 M\u1eb7t Tr\u1eddi l\u00e0?\",choices:[\n    {key:\"a\",text:\"Sao Th\u1ed5\"},\n    {key:\"b\",text:\"Sao M\u1ed9c\"}, // \u0110\n    {key:\"c\",text:\"Sao Kim\"},\n    {key:\"d\",text:\"Sao Th\u1ee7y\"}\n  ],answer:\"b\"},\n  {id:\"3\",type:\"single\",text:\"H\u00e0nh tinh n\u00e0o c\u00f3 v\u00e0nh \u0111ai n\u1ed5i b\u1eadt nh\u1ea5t?\",choices:[\n    {key:\"a\",text:\"Sao Th\u1ed5\"}, // \u0110\n    {key:\"b\",text:\"Sao Kim\"},\n    {key:\"c\",text:\"Sao H\u1ecfa\"},\n    {key:\"d\",text:\"Tr\u00e1i \u0110\u1ea5t\"}\n  ],answer:\"a\"},\n  {id:\"4\",type:\"single\",text:\"H\u00e0nh tinh n\u00e0o xa M\u1eb7t Tr\u1eddi nh\u1ea5t?\",choices:[\n    {key:\"a\",text:\"Sao H\u1ecfa\"},\n    {key:\"b\",text:\"Sao Kim\"},\n    {key:\"c\",text:\"Sao Th\u1ee7y\"},\n    {key:\"d\",text:\"Sao H\u1ea3i V\u01b0\u01a1ng\"} // \u0110\n  ],answer:\"d\"}\n];\n\nconst keyMap = {A:'a',B:'b',C:'c',D:'d','a':'a','b':'b','c':'c','d':'d','1':'a','2':'b','3':'c','4':'d'};\nconst labelMap = {'a':'A','b':'B','c':'C','d':'D'};\n\nlet state = {\n  started:false, finished:false, index:0, score:0,\n  questions:[], locked:false, lastInput:'', main:null, cooldown:0\n};\n\nfunction elt(type,opts){\n  let e=document.createElement(type);\n  if(opts)for(let k in opts){\n    if(k==='class')e.className=opts[k];\n    else if(k==='text')e.textContent=opts[k];\n    else e.setAttribute(k,opts[k]);\n  }\n  return e;\n}\n\nfunction startGame(){\n  state = Object.assign(state, {started:true, finished:false, index:0, score:0, locked:false, cooldown:0});\n  showQuestion();\n}\nfunction resetGame(){\n  state = Object.assign(state, {started:false, finished:false, index:0, score:0, locked:false, lastInput:'', cooldown:0});\n  showStart();\n}\n\nfunction showStart(){\n  let m = state.main;\n  m.innerHTML = '';\n  let scr = elt('div',{class:\"jl-screen jl-fadein\"});\n  let title = elt('div',{class:\"jl-title\",text:\"Quiz H\u1ec7 M\u1eb7t Tr\u1eddi\"});\n  let desc = elt('div',{class:\"jl-desc\",text:\"H\u00e3y ph\u00e1t \u00e2m \\\"A\\\", \\\"B\\\", \\\"C\\\" ho\u1eb7c \\\"D\\\" v\u00e0o micro ho\u1eb7c b\u1ea5m/ch\u1ea1m \u0111\u1ec3 ch\u1ecdn \u0111\u00e1p \u00e1n. C\u00f3 4 c\u00e2u h\u1ecfi v\u1ec1 c\u00e1c h\u00e0nh tinh!\"});\n  let solar = solarRow();\n  let btn = elt('button',{class:'jl-btn',text:\"B\u1eaft \u0111\u1ea7u\"});\n  btn.onclick = ()=>{startGame();};\n  scr.append(title,desc,solar,btn);\n  m.append(scr);\n}\n\nfunction showEnd(){\n  let m = state.main;\n  m.innerHTML='';\n  let scr = elt('div',{class:\"jl-screen jl-fadein\"});\n  let title=elt('div',{class:\"jl-title\",text:\"Ho\u00e0n th\u00e0nh!\"});\n  let score=elt('div',{class:\"jl-score\",text:state.score+\"/\"+state.questions.length});\n  let note=elt('div',{class:\"jl-complete\",text:getRemark(state.score,state.questions.length)});\n  let solar = solarRow();\n  let btn = elt('button',{class:\"jl-btn\",text:\"Ch\u01a1i l\u1ea1i\"});\n  btn.onclick = ()=>{resetGame();};\n  scr.append(title,score,note,solar,btn);\n  state.finished=true;\n  m.append(scr);\n  // G\u1eedi finish l\u00ean cha n\u1ebfu n\u1eb1m trong iframe\n  if(window.parent && window.parent !== window) {\n    window.parent.postMessage({type:'finish',correct:state.score,total:state.questions.length},'*');\n  }\n}\n\nfunction getRemark(score,total){\n  if(score===total)return \"Xu\u1ea5t s\u1eafc! B\u1ea1n hi\u1ec3u r\u1ea5t r\u00f5 v\u1ec1 H\u1ec7 M\u1eb7t Tr\u1eddi \ud83c\udf1e\ud83e\ude90\";\n  if(score>=total-1)return \"R\u1ea5t t\u1ed1t! B\u1ea1n ch\u1ec9 sai 1 c\u00e2u th\u00f4i! \ud83d\udc4d\";\n  if(score>=2)return \"B\u1ea1n \u0111\u00e3 tr\u1ea3 l\u1eddi kh\u00e1 \u1ed5n. C\u1ed1 g\u1eafng l\u1ea7n sau nh\u00e9!\";\n  return \"B\u1ea1n c\u1ea7n h\u1ecdc th\u00eam v\u1ec1 c\u00e1c h\u00e0nh tinh r\u1ed3i! \u2728\";\n}\n\nfunction showQuestion(){\n  let m = state.main;\n  m.innerHTML='';\n  let n = state.index+1, total = state.questions.length;\n  // Progress\n  let prog=elt('div',{class:'jl-progress'});\n  let bar=elt('div',{class:'jl-progress-bar'});\n  bar.style.width=Math.round((100*n/total))+\"%\";\n  prog.append(bar);\n\n  // Th\u1ebb c\u00e2u h\u1ecfi\n  let q = state.questions[state.index];\n  let card = elt('div',{class:\"jl-q-card jl-fadein\"});\n  let qtext=elt('div',{class:\"jl-qtext\",text:q.text});\n  card.append(qtext);\n\n  // \u0110\u00e1p \u00e1n\n  q.choices.forEach(function(ch){\n    let opt = elt('div',{class:\"jl-opt\",tabindex:\"0\"});\n    opt.setAttribute('data-key',ch.key);\n    opt.append(elt('b',{text:labelMap[ch.key]+'. '}),elt('span',{text:ch.text}));\n    opt.addEventListener('click',function(e){\n      if(!state.locked) choose(ch.key,opt);\n    });\n    opt.addEventListener('keydown',function(e){\n      if(!state.locked&&(e.code===\"Enter\"||e.code===\"Space\")) choose(ch.key,opt);\n    });\n    card.append(opt);\n  });\n\n  // D\u00f2ng ph\u00edm t\u1eaft\n  let km=elt('div',{class:'jl-keymap',text:'B\u1ea1n c\u0169ng c\u00f3 th\u1ec3 nh\u1ea5n ph\u00edm A B C D \u0111\u1ec3 ch\u1ecdn \u0111\u00e1p \u00e1n.'});\n  // H\u1ec7 m\u1eb7t tr\u1eddi nh\u1ecf\n  let solar = solarRow();\n  m.append(prog,solar,card,km);\n\n  // Focus \u0111\u00e1p \u00e1n \u0111\u1ea7u \u0111\u1ec3 thu\u1eadn ti\u1ec7n tab/space\n  let first = card.querySelector('.jl-opt');\n  setTimeout(()=>{first&&first.focus();},220);\n  state.locked=false;state.lastInput='';\n}\n\nfunction choose(key,optnode){\n  if(state.locked)return;\n  state.locked=true;\n  let q = state.questions[state.index];\n  // Nh\u1eadn \u0111\u00fang/sai\n  let isok = (key===q.answer);\n  let opts = document.querySelectorAll('.jl-opt');\n  opts.forEach(opt=>{\n    let ok = opt.getAttribute('data-key')===q.answer;\n    opt.classList.toggle('is-good',ok);\n    if(!ok && opt===optnode) opt.classList.add('is-bad');\n    // Disable tabfocus\n    opt.setAttribute('tabindex',-1);\n  });\n  // K\u00fd hi\u1ec7u check/x xu\u1ea5t hi\u1ec7n\n  showMark(optnode,isok);\n  // Ghi \u0111i\u1ec3m\n  if(isok)state.score+=1;\n  // G\u1eedi score cho h\u1ec7 th\u1ed1ng n\u1ebfu c\u00f3 API\n  if(window.JLRuntime&&window.JLRuntime.setScore) window.JLRuntime.setScore(state.score,state.questions.length);\n\n  // Chuy\u1ec3n c\u00e2u sau 0.9s\n  setTimeout(function(){\n    state.index++;\n    if(state.index>=state.questions.length){\n      showEnd();\n    }else{\n      showQuestion();\n    }\n    state.locked=false;\n  },900);\n}\n\n// \u0110\u00e1nh d\u1ea5u \u0111\u00fang/sai\nfunction showMark(opt,isok){\n  if(!opt)return;\n  let icon = elt('span',{class:'jl-icon'});\n  icon.textContent = isok?'\u2713':'\u2717';\n  opt.append(icon);\n}\n\n// Camera (Model) tr\u1ea3 k\u1ebft qu\u1ea3 nh\u1eadn qua message\nwindow.addEventListener('message',function(e){\n  let d = e.data;\n  if(!d||e.source!==parent)return;\n  if(d.type==='camera.init'){\n    // D\u00f9ng demo n\u1ebfu kh\u00f4ng truy\u1ec1n v\u00e0o\n    state.questions = Array.isArray(d.questions) && d.questions.length>=1 ? d.questions : DEMO;\n    resetGame();\n    if(window.JLRuntime&&window.JLRuntime.setProgress)window.JLRuntime.setProgress(0,state.questions.length);\n  }\n  if(d.type==='camera.result'&&!state.locked&&state.started&&!state.finished){\n    // Ch\u1ec9 nh\u1eadn input model l\u00e0 a/b/c/d\n    let inp = (typeof d.input==='string')?d.input.toLowerCase():'';\n    if(!['a','b','c','d'].includes(inp))return;\n    // Ch\u1ed1ng l\u1eb7p l\u1ea1i c\u00f9ng \u0111\u00e1p \u00e1n trong 1 c\u00e2u do debounce\n    if(inp===state.lastInput)return;\n    state.lastInput=inp;\n    let opts = document.querySelectorAll('.jl-opt');\n    for(let i=0;i<opts.length;++i){\n      if(opts[i].getAttribute('data-key')===inp){\n        choose(inp,opts[i]);\n        break;\n      }\n    }\n  }\n});\n\n// Ph\u00edm t\u1eaft\nwindow.addEventListener('keydown',function(e){\n  if(state.locked||!state.started||state.finished)return;\n  let k = (e.key||'').toUpperCase();\n  if(['A','B','C','D','1','2','3','4'].includes(k)){\n    let inp = keyMap[k];\n    let opts = document.querySelectorAll('.jl-opt');\n    for(let i=0;i<opts.length;++i){\n      if(opts[i].getAttribute('data-key')===inp){\n        choose(inp,opts[i]);\n        break;\n      }\n    }\n  }\n});\n\n// H\u1ed7 tr\u1ee3 v\u1edbi JLRuntime n\u1ebfu c\u00f3\nif(window.JLRuntime){\n  window.JLRuntime.onInit(function(ctx){\n    state.questions = Array.isArray(ctx.questions)&&ctx.questions.length>=1 ? ctx.questions : DEMO;\n    resetGame();\n  });\n  window.JLRuntime.onAction(function(result){\n    if(!result||!result.input||state.locked||!state.started||state.finished)return;\n    let inp = String(result.input).toLowerCase();\n    if(!['a','b','c','d'].includes(inp))return;\n    if(inp===state.lastInput)return;\n    state.lastInput=inp;\n    let opts = document.querySelectorAll('.jl-opt');\n    for(let i=0;i<opts.length;++i){\n      if(opts[i].getAttribute('data-key')===inp){\n        choose(inp,opts[i]);\n        break;\n      }\n    }\n  });\n}\n\n// H\u1ec7 m\u1eb7t tr\u1eddi nh\u1ecf trang tr\u00ed\nfunction solarRow(){\n  let row=elt('div',{class:'jl-solar'});\n  [\n    {cl:'planet p-sun',title:'M\u1eb7t Tr\u1eddi'},\n    {cl:'planet p-mer',title:'Sao Th\u1ee7y'},\n    {cl:'planet p-ven',title:'Sao Kim'},\n    {cl:'planet p-ear',title:'Tr\u00e1i \u0110\u1ea5t'},\n    {cl:'planet p-mar',title:'Sao H\u1ecfa'},\n    {cl:'planet p-jup',title:'Sao M\u1ed9c'},\n    {cl:'planet p-sat',title:'Sao Th\u1ed5'},\n    {cl:'planet p-ura',title:'Sao Thi\u00ean V\u01b0\u01a1ng'},\n    {cl:'planet p-nep',title:'Sao H\u1ea3i V\u01b0\u01a1ng'}\n  ].forEach(obj=>{\n    let p=elt('div',{class:obj.cl});\n    p.title=obj.title;\n    row.append(p);\n  });\n  return row;\n}\n\n// Kh\u1edfi \u0111\u1ed9ng v\u00e0o m\u00e0n h\u00ecnh b\u1eaft \u0111\u1ea7u\nwindow.addEventListener('DOMContentLoaded',function(){\n  state.main=document.getElementById('main');\n  showStart();\n  // Th\u00f4ng b\u00e1o ready l\u00ean cha sau mount\n  setTimeout(function(){\n    if(window.parent&&window.parent!==window&&!(window.JLRuntime))window.parent.postMessage({type:'ready'},'*');\n  },38);\n});\n\n})();\n<\/script>\n<\/body>\n<\/html><script>setTimeout(function(){var b=document.querySelector('button, .jl-btn, [class*=start] button'); if(b){b.click();}}, 1400);<\/script>";
