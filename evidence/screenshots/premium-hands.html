to; padding: 0; min-height:100vh;\n      position:relative; z-index:1;\n    }\n    .jl-screen {\n      background: rgba(255,255,255,0.9);\n      border-radius: 18px;\n      padding: 32px 15px 28px 15px;\n      margin: 36px 12px 12px 12px;\n      box-shadow:0 2px 16px #0001;\n      display:flex; flex-direction:column; align-items:center;\n      min-height:320px;\n      z-index: 10;\n      position: relative;\n    }\n    .jl-btn {\n      min-width:120px; min-height:54px;\n      font-size:1.25em; margin:18px 0 0 0;\n      background:linear-gradient(90deg, #ffd564 80%, #ffb600 100%);\n      border:none; border-radius:12px; color:#344;\n      font-weight:bold; cursor:pointer; outline:none;\n      transition:background .2s, box-shadow .2s;\n      box-shadow:0 2px 8px #0001;\n      letter-spacing:0.02em;\n    }\n    .jl-btn:active { background:#ffb600 }\n    .jl-fadein {animation: fadein .5s;}\n    @keyframes fadein {from{opacity:0;transform:scale(0.96);} to{opacity:1;transform:scale(1);}}\n    .apple-area {\n      width:100%;height:390px;\n      margin:0 auto;position:relative;overflow:visible;\n      touch-action: none;\n      user-select:none;\n      background:linear-gradient(180deg, transparent 67%, #63b045 95%, #427c28 100%);\n      border-radius: 18px 18px 30px 30px;\n      box-shadow:0 4px 16px #367c2833 inset;\n    }\n    .q-text {\n      font-size: 1.4em; font-weight: 600;\n      margin: 22px 0 9px 0; text-align: center;\n      letter-spacing: 1px;\n      min-height:2.2em;\n    }\n    .jl-opt {\n      position: absolute;\n      cursor: pointer;\n      outline:none;\n      user-select:none;\n      z-index: 1;\n      transition: transform .15s cubic-bezier(.3,.76,.48,1.13);\n      will-change: transform,box-shadow;\n      filter: drop-shadow(0 5px 8px #5e44422a);\n      text-align: center;\n    }\n    .jl-opt.selected {\n      transform: scale(1.15) translateY(-8px);\n      z-index: 2;\n      filter: drop-shadow(0 10px 18px #fa9393a1);\n    }\n    .jl-opt.is-good {\n      animation: bop .4s cubic-bezier(.17,.67,.46,1.24);\n      box-shadow:0 0 0 4px #2cd45380;\n    }\n    .jl-opt.is-bad {\n      animation: bop .28s cubic-bezier(.24,.49,.76,1.28);\n      box-shadow:0 0 0 4px #ff00006c;\n    }\n    @keyframes bop {\n      20% {transform:scale(1.25) translateY(-8px);}\n      100% {transform:scale(1) translateY(0);}\n    }\n    .jl-opt .answer-key {\n      background:#fff9; color:#a45a1c;\n      border-radius:10px; position:absolute; left:50%;top:-36px; min-width:2.1em;\n      transform:translateX(-50%);\n      font-size:.95em;font-weight:bold;padding:2px 10px 3px 10px; box-shadow:0 2px 8px #0001;\n      pointer-events:none;\n    }\n    .apple-emoji {\n      width:60px;height:60px;display:inline-block;\n      user-select:none;\n      /* Use inline SVG below for apples. */\n    }\n    .basket {\n      position:absolute; left:50%; bottom:6px;\n      transform:translateX(-50%);\n      width:110px; height:74px;\n      z-index:2;\n      pointer-events:none;\n      transition:filter .2s;\n      filter:drop-shadow(0 7px 20px #894a1f5a);\n      background: none;\n    }\n    .basket-pointer {\n      position: absolute; left:0;top:0;width:100%;height:100%;\n      pointer-events: none;\n      z-index:3;\n    }\n    .basket.hand {filter: drop-shadow(0 0 10px #18b1f86c);}\n    .scorebar {\n      font-size:1.1em;margin:4px 0 0 0;\n      text-align:center;\n      letter-spacing:1px;\n      color: #174909;\n      padding:2px 0 0 0;\n    }\n    /* Responsive */\n    @media (max-width:600px){\n      .apple-area{height:320px;}\n      .basket{width:88px;height:56px;}\n      .apple-emoji{width:44px;height:44px;}\n      .jl-opt .answer-key{font-size:.89em;top:-30px;}\n      .jl-screen{padding:18px 5px;}\n    }\n  <\/style>\n<\/head>\n<body>\n<div class=\"apple-game-root\" id=\"gameRoot\">\n  <div class=\"jl-screen jl-fadein\" id=\"startScreen\">\n    <h2 style=\"font-size:2em;text-shadow:1px 2px 0 #fff7\">Thu ho\u1ea1ch t\u00e1o \u00f4n t\u1eadp<br>ph\u00e9p nh\u00e2n l\u1edbp 3<\/h2>\n    <div style=\"font-size:1.1em;max-width:350px;margin:12px auto 5px auto;color:#356;\">\n      H\u00e3y di chuy\u1ec3n b\u00e0n tay (ho\u1eb7c chu\u1ed9t/tay ch\u1ea1m) \u0111\u1ec3 ch\u1ecdn qu\u1ea3 t\u00e1o c\u00f3 \u0111\u00e1p \u00e1n \u0111\u00fang, sau \u0111\u00f3 n\u1eafm tay (ho\u1eb7c nh\u1ea5n v\u00e0o) \u0111\u1ec3 h\u00e1i.<br> M\u1ed7i qu\u1ea3 t\u00e1o mang m\u1ed9t \u0111\u00e1p \u00e1n!\n    <\/div>\n    <button class=\"jl-btn\" id=\"btnStart\">B\u1eaft \u0111\u1ea7u<\/button>\n  <\/div>\n  <div style=\"display:none\" id=\"gameScreen\">\n    <div class=\"q-text\" id=\"qText\"><\/div>\n    <div class=\"apple-area\" id=\"appleArea\"><\/div>\n    <div class=\"scorebar\" id=\"scoreBar\"><\/div>\n  <\/div>\n  <div class=\"jl-screen\" id=\"endScreen\" style=\"display:none\"><\/div>\n<\/div>\n<script>\n(function(){\nconst DEMO_QUESTIONS = [\n  {\n    id:\"q1\", type:\"single\", text:\"2 \u00d7 4 = ?\", \n    choices:[\n      {key:\"A\", text:\"6\"},\n      {key:\"B\", text:\"8\"},\n      {key:\"C\", text:\"9\"}\n    ],\n    answer:\"B\"\n  },\n  {\n    id:\"q2\", type:\"single\", text:\"5 \u00d7 3 = ?\", \n    choices:[\n      {key:\"A\", text:\"15\"},\n      {key:\"B\", text:\"12\"},\n      {key:\"C\", text:\"10\"}\n    ],\n    answer:\"A\"\n  },\n  {\n    id:\"q3\", type:\"single\", text:\"6 \u00d7 6 = ?\", \n    choices:[\n      {key:\"A\", text:\"12\"},\n      {key:\"B\", text:\"36\"},\n      {key:\"C\", text:\"28\"}\n    ],\n    answer:\"B\"\n  },\n  {\n    id:\"q4\", type:\"single\", text:\"9 \u00d7 2 = ?\", \n    choices:[\n      {key:\"A\", text:\"16\"},\n      {key:\"B\", text:\"18\"},\n      {key:\"C\", text:\"21\"}\n    ],\n    answer:\"B\"\n  },\n  {\n    id:\"q5\", type:\"single\", text:\"7 \u00d7 3 = ?\", \n    choices:[\n      {key:\"A\", text:\"20\"},\n      {key:\"B\", text:\"21\"},\n      {key:\"C\", text:\"24\"}\n    ],\n    answer:\"B\"\n  }\n];\nconst APPLES_POS = [ // % x, y (upper area), for max 4 apples\n  {x:22, y:32},\n  {x:55, y:21},\n  {x:79, y:33},\n  {x:39, y:12}\n];\nconst COLORS = [\"#ff6363\",\"#feae2d\",\"#41c162\",\"#b36dfd\"];\nconst APPLE_SVG = `<svg viewBox=\"0 0 70 70\" fill=\"none\" class=\"apple-emoji\"><ellipse cx=\"32\" cy=\"41\" rx=\"29\" ry=\"25\" fill=\"#ff3448\"/><ellipse cx=\"32\" cy=\"41\" rx=\"26\" ry=\"20\" fill=\"#fa606a\"/><ellipse cx=\"39\" cy=\"29\" rx=\"10\" ry=\"6\" fill=\"#fff5\" opacity=\".9\"/><ellipse cx=\"41\" cy=\"24\" rx=\"3.5\" ry=\"2\" fill=\"#fff\" opacity=\".6\"/><ellipse cx=\"32\" cy=\"8\" rx=\"5\" ry=\"3\" fill=\"#53b748\"/><rect x=\"29\" y=\"8\" width=\"6\" height=\"13\" rx=\"3\" fill=\"#865120\"/><\/svg>`;\nconst BASKET_SVG = `<svg viewBox=\"0 0 120 70\" class=\"basket\"><ellipse cx=\"60\" cy=\"56\" rx=\"50\" ry=\"17\" fill=\"#f89c3a\" stroke=\"#835228\" stroke-width=\"4\"/><ellipse cx=\"60\" cy=\"40\" rx=\"42\" ry=\"20\" fill=\"#fec56d\" stroke=\"#b37d2b\" stroke-width=\"3\" opacity=\"0.7\"/><rect x=\"44\" y=\"18\" width=\"32\" height=\"30\" rx=\"16\" fill=\"#edbf70\" stroke=\"#ab812a\" stroke-width=\"3\"/><ellipse cx=\"60\" cy=\"40\" rx=\"41\" ry=\"17\" fill=\"none\" stroke=\"#d29a4a\" stroke-width=\"2\" opacity=\".48\"/><ellipse cx=\"60\" cy=\"40\" rx=\"23\" ry=\"8\" fill=\"none\" stroke=\"#deae32\" stroke-width=\"2\" opacity=\".55\"/><\/svg>`;\nlet questions=[], gameState=\"start\", qIdx=0, score=0, selected=null, dwell=0, dwellId=null, handMode=false, handX=50, handY=77, cooldown=false, apples=[], qCur;\nlet basketEl, pointerEl, appleArea, scoreBar, qText, endScreen, root, gameScreen, startScreen;\nlet actionLock=false, pointerLock=false;\n\n// ----------- Setup Elements\nfunction $(id){return document.getElementById(id);}\nfunction showScreen(id){\n  [startScreen,gameScreen,endScreen].forEach(x=>x.style.display=\"none\");\n  if(id===\"start\") startScreen.style.display=\"\";\n  else if(id===\"game\") gameScreen.style.display=\"\";\n  else if(id===\"end\") endScreen.style.display=\"\";\n}\nfunction renderStart(){\n  showScreen(\"start\");\n}\nfunction renderEnd(){\n  showScreen(\"end\");\n  let txt = `<div style=\"font-size:2em;font-weight:700;color:#1a960f\">Ho\u00e0n th\u00e0nh!<\/div>\n    <div style=\"margin:8px 0 12px 0;font-size:1.12em;\">B\u1ea1n \u0111\u00e3 h\u00e1i \u0111\u01b0\u1ee3c <b>${score}<\/b> tr\u00ean <b>${questions.length}<\/b> qu\u1ea3 t\u00e1o!<\/div>\n    <div style=\"font-size:1em;color:#276;\">${score>3?\"R\u1ea5t t\u1ed1t!\":\"B\u1ea1n h\u00e3y \u00f4n luy\u1ec7n th\u00eam nh\u00e9!\"}<\/div>\n    <button class=\"jl-btn\" id=\"btnReset\">Ch\u01a1i l\u1ea1i<\/button>`;\n  endScreen.innerHTML=txt;\n  $(\"btnReset\").onclick = resetGame;\n}\nfunction showScoreBar(){\n  scoreBar.textContent = `S\u1ed1 c\u00e2u \u0111\u00fang: ${score} / ${questions.length}`;\n}\n\n// ----------- Apples\nfunction renderApples(){\n  appleArea.innerHTML=\"\";\n  apples=[]; selected=null;\n  let cs = qCur.choices, used=[]; \n  let areaW=appleArea.clientWidth||320, areaH=appleArea.clientHeight||340;\n  cs.forEach((c, i)=>{\n    let pos = APPLES_POS[i]||{x:25+35*i,y:40};\n    let left = (pos.x/100)*areaW-34, top = (pos.y/100)*areaH;\n    let color = COLORS[i%COLORS.length];\n    let d = document.createElement(\"div\");\n    d.className=\"jl-opt\"; d.dataset.key = c.key;\n    d.style.left=left+\"px\"; d.style.top=top+\"px\";\n    d.setAttribute('tabindex','0');\n    d.innerHTML = `<div class=\"answer-key\">${c.key}<\/div>${APPLE_SVG.replace(\"#ff3448\", color)}`+\n      `<div style=\"margin-top:-9px;font-size:1.2em;font-weight:bold;white-space:nowrap;color:#234;text-shadow:1px 1px 0 #fff7;\">${c.text}<\/div>`;\n    d.onclick =()=>{if(!cooldown&&!actionLock) harvest(c.key);}\n    d.onpointerdown =()=>{if(!cooldown&&!actionLock) harvest(c.key);}\n    d.onkeydown = e=>{\n      if((e.key===' '||e.key==='Enter')&&!cooldown&&!actionLock) harvest(c.key);\n    };\n    appleArea.appendChild(d);\n    apples.push({key:c.key,el:d,left,top,right:left+68,bottom:top+72});\n  });\n}\nfunction findAppleAt(x,y){\n  // scale x,y from [0,100] (%) to px in appleArea\n  let areaW=appleArea.clientWidth||320, areaH=appleArea.clientHeight||340;\n  let xx = x/100*areaW, yy = y/100*areaH;\n  for(let i=0;i<apples.length;i++){\n    let a=apples[i];\n    if(xx>=a.left&&xx<=a.right&&yy>=a.top&&yy<=a.bottom) return a;\n  }\n  return null;\n}\n\n// ----------- Basket Pointer\nfunction setupBasket(){\n  if(!basketEl){\n    basketEl = document.createElement(\"div\");\n    basketEl.innerHTML = BASKET_SVG;\n    basketEl.classList.add(\"basket\");\n    basketEl.style.left=\"50%\";\n    basketEl.style.bottom=\"6px\";\n    basketEl.style.position=\"absolute\";\n    basketEl.style.transform=\"translateX(-50%)\";\n    pointerEl = document.createElement(\"div\");\n    pointerEl.className=\"basket-pointer\";\n    appleArea.appendChild(basketEl);\n    appleArea.appendChild(pointerEl);\n  }\n  moveBasket(handX, handY, false);\n}\nfunction moveBasket(x,y,withHand){\n  // x, y in [0,100] percent\n  let areaW=appleArea.clientWidth||320, areaH=appleArea.clientHeight||340;\n  let bx = x/100*areaW-55, by = y/100*areaH-37;\n  basketEl.style.left = Math.max(0,Math.min(areaW-110,bx))+\"px\";\n  basketEl.style.top = Math.max(0,Math.min(areaH-74,by))+\"px\";\n  basketEl.classList.toggle('hand', !!withHand);\n  pointerEl.style.left=bx+\"px\";\n  pointerEl.style.top=by+\"px\";\n}\n// ----------- Game Logic\nfunction renderGame(){\n  showScreen(\"game\");\n  qCur = questions[qIdx];\n  qText.textContent = qCur.text;\n  renderApples();\n  showScoreBar();\n  setupBasket(); // always stick basket\n  handMode && moveBasket(handX,handY,false);\n  cooldown=false; actionLock=false; pointerLock=false;\n}\nfunction nextQuestion(){\n  qIdx++; \n  if(qIdx>=questions.length){\n    setTimeout(()=>{\n     renderEnd();\n     try{parent.postMessage({type:'finish',correct:score,total:questions.length},'*');}catch(e){}\n    },420);\n  }else{\n    setTimeout(()=>{ renderGame(); }, 620);\n  }\n}\nfunction resetGame(){\n  qIdx=0; score=0;\n  cooldown=false; actionLock=false;\n  showScreen(\"start\");\n}\nfunction harvest(key){\n  if(cooldown||actionLock)return;\n  let ans = qCur.answer;\n  let opt = apples.find(a=>a.key===key);\n  cooldown=true; actionLock=true;\n  if(opt){\n    opt.el.classList.add(key===ans?'is-good':'is-bad');\n    opt.el.classList.add('selected');\n    setTimeout(()=>{ opt.el.classList.remove('selected'); },200);\n  }\n  if(key===ans) score++;\n  showScoreBar();\n  setTimeout(()=>{ \n    apples.forEach(a=>a.el.classList.remove('is-good','is-bad','selected'));\n    nextQuestion();\n    cooldown=false; actionLock=false;\n  }, key===ans?600:800);\n}\nfunction setSelectedByHand(x,y){\n  let a = findAppleAt(x,y);\n  apples.forEach(ap=>ap.el.classList.toggle('selected', ap===a));\n  selected = a;\n}\n\nfunction onHandPointer(px,py){\n  handX = Math.max(8, Math.min(92, px));\n  handY = Math.max(15, Math.min(85, py));\n  moveBasket(handX, handY, true);\n  setSelectedByHand(handX, handY);\n}\n\nfunction dwellSelect(){\n  if(!selected||cooldown||actionLock)return;\n  harvest(selected.key);\n}\nfunction handlePointerArea(e){\n  let rect = appleArea.getBoundingClientRect();\n  let x = ((e.clientX-rect.left)/rect.width)*100;\n  let y = ((e.clientY-rect.top)/rect.height)*100;\n  handX = x; handY = y;\n  moveBasket(handX, handY, false);\n  setSelectedByHand(x,y);\n}\nfunction bindPointer(){\n  appleArea.onpointermove=handlePointerArea;\n  appleArea.ontouchmove=e=>{\n    if(e.touches&&e.touches[0]) {\n      let r=appleArea.getBoundingClientRect(), t=e.touches[0];\n      let x=((t.clientX-r.left)/r.width)*100, y=((t.clientY-r.top)/r.height)*100;\n      handX=x; handY=y;\n      moveBasket(handX,handY,false);\n      setSelectedByHand(x,y);\n      e.preventDefault();\n    }\n  };\n  appleArea.onpointerleave=()=>{apples.forEach(a=>a.el.classList.remove('selected'));};\n  appleArea.onpointerdown=e=>{\n    if(selected&&!cooldown&&!actionLock) harvest(selected.key);\n  };\n}\nfunction bindKeys(){\n  document.addEventListener('keydown',e=>{\n    if(gameState!==\"game\"||cooldown||actionLock)return;\n    let c = e.key.toUpperCase();\n    if(c==='A'||c==='B'||c==='C'||c==='D'){\n      let k=c,opt=apples.find(a=>a.key===k);\n      if(opt&&!cooldown) harvest(opt.key);\n    }\n  });\n}\n\n// ----------- HAND Model & RUNTIME\nfunction setupHandRuntime(){\n  // If JLRuntime exists, integrate\n  if(window.JLRuntime){\n    window.JLRuntime.onInit(d=>{\n      questions = d.questions||DEMO_QUESTIONS;\n      qIdx=0;score=0;gameState=\"game\";\n      renderGame();\n    });\n    window.JLRuntime.onHand((lms)=>{\n      // lms[8]: index tip, lms[9]: palm center, both {x:0..1,y:0..1}\n      // map to area\n      let areaW=appleArea.clientWidth||320, areaH=appleArea.clientHeight||340;\n      if(!lms||!lms[8]) return;\n      let xx = lms[8].x*100, yy = lms[8].y*100;\n      handMode=true; onHandPointer(xx,yy);\n    });\n    window.JLRuntime.onAction(d=>{\n      // d.input === 'grab' (n\u1eafm tay)\n      if(selected&&!cooldown&&!actionLock&&(d.input==='grab')) harvest(selected.key);\n    });\n    window.JLRuntime.setProgress&&(window.JLRuntime.setProgress(qIdx,questions.length));\n    window.JLRuntime.setScore&&(window.JLRuntime.setScore(score,questions.length));\n    bindPointer();\n    bindKeys();\n    return true;\n  }\n  return false;\n}\n// --- Classic Hand Adapter\nfunction classicAdapter(){\n  // G\u1eedi ready, b\u1eadt hands, nh\u1eadn camera.*\n  window.addEventListener('message',function(e){\n   let d=e.data; if(!d||e.source!==parent)return;\n   if(d.type===\"camera.init\"){\n     questions = d.questions||DEMO_QUESTIONS;\n     qIdx=0;score=0;gameState=\"game\";\n     renderGame();\n   }\n   if(d.type===\"camera.hand\" && d.hands && d.hands[0] && d.hands[0][8]){\n     handMode=true;\n     let lm = d.hands[0];\n     let areaW=appleArea.clientWidth||320, areaH=appleArea.clientHeight||340;\n     let x=lm[8].x*100, y=lm[8].y*100;\n     onHandPointer(x,y);\n     if(selected){\n      if(dwellId) clearTimeout(dwellId);\n      dwellId = setTimeout(dwellSelect, 700);\n     }else{ if(dwellId) {clearTimeout(dwellId); dwellId=null;} }\n   }\n   if(d.type===\"camera.result\" && d.input==='grab'){\n     if(selected&&!cooldown&&!actionLock) harvest(selected.key);\n   }\n  });\n  try{\n    parent.postMessage({type:'ready'},'*');\n    setTimeout(()=>{parent.postMessage({type:'hands',on:true},'*');}, 60);\n  }catch(e){}\n  bindPointer();\n  bindKeys();\n}\n// ------------ STARTUP / ATTACH\nfunction main(){\n  root=$(\"gameRoot\");gameScreen=$(\"gameScreen\");\n  startScreen=$(\"startScreen\");endScreen=$(\"endScreen\");\n  qText=$(\"qText\");appleArea=$(\"appleArea\");scoreBar=$(\"scoreBar\");\n  // Start screen\n  $(\"btnStart\").onclick = ()=>{\n    gameState=\"game\";\n    questions=DEMO_QUESTIONS;\n    qIdx=0;score=0;\n    renderGame();\n    // N\u1ebfu runtime kh\u00f4ng g\u1eafn auto, c\u00f3 th\u1ec3 ch\u01a1i demo lu\u00f4n\n  };\n  // Init runtime\n  if(!setupHandRuntime()) classicAdapter();\n}\nmain();\n})();\n<\/script>\n<\/body>\n<\/html><script>setTimeout(function(){var b=document.querySelector('button, .jl-btn, [class*=start] button'); if(b){b.click();}}, 1400);<\/script>";
