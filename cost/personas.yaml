# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Bản CP3 này số liệu tạm: tần suất lấy từ khảo sát S1–S6 (n = 6), quy mô và số lượt/phiên (tự ước tính).
# Cập nhật lại khi T03 đủ dữ liệu (≥20 phiếu khảo sát hoặc ≥3 phỏng vấn).

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới (ở đây: giáo viên)
  low: 100
  base: 300
  high: 1000
  source: "Quy mô giáo viên dùng thử sản phẩm — (tự ước tính), repo chưa có số công khai; chờ T03 bổ sung dữ liệu thì cập nhật."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.67              # 4/6 phiếu S1–S6 chọn "1–2 lần", làm tròn
    uses_per_month: 1.5      # trung điểm "1–2 lần / tháng": (tự ước tính) — TV1 đã làm rõ khung 30 ngày, evidence/survey/questions.md + summary.md §2
    turns_per_session: 1     # (tự ước tính)
    source: "Khảo sát S1–S6, evidence/summary.md §2: '1–2 lần' 4/6; share làm tròn, số lượt/phiên (tự ước tính)."
  - name: dung_vua
    share: 0.17              # 1/6 phiếu chọn "3–5 lần", làm tròn
    uses_per_month: 4        # trung điểm "3–5 lần / tháng": (tự ước tính) — cùng khung 30 ngày đã làm rõ ở evidence/survey/questions.md
    turns_per_session: 2     # (tự ước tính)
    source: "Khảo sát S1–S6, evidence/summary.md §2: '3–5 lần' 1/6; share làm tròn, số lượt/phiên (tự ước tính)."
  - name: dung_nhieu
    share: 0.16              # 1/6 phiếu chọn ">10 lần", làm tròn để tổng share = 1
    uses_per_month: 11       # mốc thấp nhất của ">10" để không đẩy chi phí lên — (tự ước tính)
    turns_per_session: 4     # (tự ước tính)
    source: "Khảo sát S1–S6, evidence/summary.md §2: '>10 lần' 1/6; share làm tròn, số lượt/phiên (tự ước tính)."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — bảng Standard của OpenAI, có link + ngày xem. ≥2 mức model
  - model: gpt-4o-mini
    input: 0.15
    output: 0.6
    source: "https://platform.openai.com/docs/pricing · xem 28/11/2026 (Standard: vào 0.15 · ra 0.60 $/1M; model đang dùng ở T07, bảng giá ghi deprecated)"
  - model: gpt-4o
    input: 2.5
    output: 10
    source: "https://platform.openai.com/docs/pricing · xem 28/11/2026 (Standard: vào 2.50 · ra 10.00 $/1M; mức mạnh hơn để so sánh)"

usd_to_vnd:         # tuỳ chọn: để trống vì repo chưa có nguồn tỷ giá đáng tin
  rate:
  source:
