<style>
:root{--navy:#0a1733;--navy2:#10244a;--gold:#e8c547;--green:#12b76a;--red:#ef4444;--blue:#38a3ff;--ink:#eaf1ff}
html,body{margin:0;height:100%;overflow:hidden;background:#050b1c;font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#scene{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;overflow:hidden;background:#0a1733;color:var(--ink)}
#scene>*{position:absolute}
.stage3d{left:0;top:0;width:1280px;height:720px;display:block}
.nogl{inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-size:28px;line-height:1.5;z-index:30;background:#0a1733}
/* broadcast scoreboard */
.hud{left:24px;top:18px;display:flex;align-items:stretch;z-index:5;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));font-weight:800}
.team{display:flex;align-items:center;gap:12px;padding:7px 16px;background:linear-gradient(var(--navy2),var(--navy));color:#fff;font-size:20px;letter-spacing:.02em;text-transform:uppercase;border-top:3px solid #ef476f}
.team.a{border-radius:10px 0 0 10px}.team.b{border-radius:0 10px 10px 0;border-top-color:#38a3ff}.team.solo{border-radius:10px 0 0 10px;border-top-color:var(--green)}
.team .sc{display:grid;place-items:center;min-width:34px;height:32px;border-radius:5px;background:#fff;color:var(--navy);font-size:22px}
.dots{display:flex;gap:5px}.dot{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}.dot.win{background:var(--green);box-shadow:none}.dot.lose{background:var(--red);box-shadow:none}
.mid{display:grid;place-items:center;padding:0 14px;background:var(--gold);color:var(--navy);font-size:17px;text-transform:uppercase;border-radius:0 10px 10px 0}.team.a+.mid{border-radius:0}
.who{left:50%;top:62px;transform:translateX(-50%);z-index:5;padding:5px 18px;border-radius:999px;background:rgba(10,23,51,.88);color:#fff;font-weight:700;font-size:17px;display:none;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.who.on{display:block}.who b{padding:1px 9px;border-radius:999px;color:#fff}.who b.t0{background:#ef476f}.who b.t1{background:#2f8fe6}
/* question: lower third */
.qcard{right:24px;bottom:24px;width:780px;min-height:64px;max-height:110px;box-sizing:border-box;padding:8px 22px 8px 14px;background:linear-gradient(var(--navy2),var(--navy));border-left:8px solid var(--gold);border-radius:10px;z-index:5;font-size:var(--qs,26px);font-weight:700;line-height:1.28;color:#fff;overflow:hidden;display:none;align-items:center;gap:14px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.qcard.on{display:flex}
.qtag{flex:none;background:var(--gold);color:var(--navy);border-radius:6px;padding:3px 12px;font-size:16px;font-weight:900;text-transform:uppercase}
.qbody{flex:1;overflow:hidden}.qbody p{margin:0}.qbody img{max-height:70px;vertical-align:middle;border-radius:6px;margin-left:10px}
.fuse{left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.12);z-index:6;display:none}.fuse.on{display:block}
.fuse i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7bd88f)}.fuse i.low{background:var(--red)}
/* scene before the kick: cinema bars and a caption */
.intro{inset:0;z-index:3;pointer-events:none;display:none}.intro.on{display:block}
.intro::before,.intro::after{content:"";position:absolute;left:0;right:0;height:52px;background:#000;animation:bar .5s ease-out}.intro::before{top:0}.intro::after{bottom:0}
@keyframes bar{from{height:0}}
.intro .cap{position:absolute;left:44px;bottom:78px;display:flex;align-items:center;gap:16px;padding:10px 30px 10px 10px;background:linear-gradient(var(--navy2),var(--navy));border-left:10px solid var(--c,#e8c547);border-radius:10px;animation:slide .45s cubic-bezier(.2,1.2,.4,1);box-shadow:0 10px 24px rgba(0,0,0,.5);max-width:900px}
.intro .no{display:grid;place-items:center;min-width:62px;height:62px;border-radius:8px;background:var(--c,#e8c547);color:#fff;font-size:34px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.intro b{display:block;font-size:30px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.15;color:#fff}.intro small{display:block;font-size:16px;font-weight:600;color:#b7c8e8;margin-top:2px}
.intro .skip{position:absolute;right:30px;bottom:12px;padding:4px 14px;border-radius:999px;background:rgba(10,23,51,.85);color:#fff;font-size:13px;font-weight:700}
/* per-star cheer word */
.cheer{display:block;margin-top:2px;font-style:italic;font-weight:900;font-size:50px;letter-spacing:.03em;text-transform:uppercase;background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.9);paint-order:stroke fill;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6));animation:shine 1.2s linear infinite,thump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes shine{to{background-position:-200% 0}}@keyframes thump{from{transform:scale(.2) rotate(-6deg)}to{transform:none}}
/* highlight replay */
.replay{inset:0;z-index:8;pointer-events:none;display:none}.replay.on{display:block}
.replay::before,.replay::after{content:"";position:absolute;left:0;right:0;height:64px;background:#000;animation:bar .4s ease-out}.replay::before{top:0}.replay::after{bottom:0}
.replay .wipe{position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85) 45%,var(--gold) 55%,transparent);transform:skewX(-14deg);animation:wipe .7s ease-in forwards}
@keyframes wipe{to{left:120%}}
.replay .badge{position:absolute;left:30px;top:78px;display:flex;align-items:center;gap:9px;padding:6px 18px;border-radius:6px;background:#d62839;color:#fff;font-weight:900;font-size:20px;letter-spacing:.14em;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.replay .badge i{width:12px;height:12px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.15}}
.replay .hl{position:absolute;left:30px;bottom:82px;padding:10px 26px 10px 18px;background:linear-gradient(var(--navy2),var(--navy));border-left:10px solid var(--gold);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.5);animation:slide .45s cubic-bezier(.2,1.2,.4,1)}
.replay .hl b{display:block;font-size:34px;font-weight:900;font-style:italic;letter-spacing:.06em;color:#fff}.replay .hl span{font-size:16px;font-weight:600;color:#b7c8e8}.replay .hl em{font-style:normal;font-weight:800;color:var(--gold)}
.replay .cheer{position:absolute;left:0;right:0;top:84px;text-align:center;font-size:80px}
.replay .skip{position:absolute;right:30px;bottom:76px;padding:4px 14px;border-radius:999px;background:rgba(10,23,51,.85);color:#fff;font-size:13px;font-weight:700}
/* answer tags on the goal mouth */
.tiles{inset:0;z-index:4;pointer-events:none}
.tile{position:absolute;left:0;top:0;box-sizing:border-box;display:flex;align-items:center;gap:9px;padding:0 12px 0 7px;border-radius:999px;background:rgba(8,20,45,.8);border:1px solid rgba(255,255,255,.4);color:#fff;font-weight:700;line-height:1.15;overflow:hidden;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px);transition:background .12s,opacity .2s,border-color .12s,color .12s;--fill:0deg;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.tile b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:16px;font-weight:900}
.tile span{flex:1;overflow:hidden;max-height:100%;text-overflow:ellipsis}.tile span p{margin:0}
.tile.hot{background:var(--gold);color:var(--navy);border-color:#fff}
.tile.mine{background:rgba(24,100,190,.92);border-color:#bfe0ff}
.tile.locking{background:conic-gradient(var(--blue) var(--fill),rgba(8,20,45,.85) 0);border-color:#bfe0ff}
.tile.dim{opacity:.16;pointer-events:none}.tile.good{opacity:.95;pointer-events:none;background:rgba(14,140,80,.95);border-color:#b8f5d3}.tile.bad{opacity:.95;pointer-events:none;background:rgba(190,40,40,.95);border-color:#ffc9c9}
/* verdict banner */
.verdict{left:0;right:0;top:92px;text-align:center;z-index:7;font-size:54px;line-height:1.15;font-weight:900;font-style:italic;letter-spacing:.02em;color:#fff;opacity:0;pointer-events:none;padding:6px 0;text-shadow:0 4px 14px rgba(0,0,0,.5)}
.verdict small{display:block;font-size:22px;font-style:normal;font-weight:700;letter-spacing:0;color:#fff;background:rgba(10,23,51,.9);width:max-content;max-width:760px;margin:8px auto 0;padding:5px 20px;border-radius:999px;text-shadow:none}
.verdict.on{opacity:1;animation:slide .45s cubic-bezier(.2,1.2,.4,1)}.verdict.ok{background:linear-gradient(90deg,transparent,rgba(18,183,106,.92) 18%,rgba(18,183,106,.92) 82%,transparent)}.verdict.no{background:linear-gradient(90deg,transparent,rgba(220,50,60,.92) 18%,rgba(220,50,60,.92) 82%,transparent)}
@keyframes slide{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
/* camera preview + status chips */
.pip{right:24px;top:78px;width:208px;height:156px;border-radius:12px;border:2px solid rgba(255,255,255,.8);background:#0a1733;overflow:hidden;z-index:6;display:none;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.pip.on{display:block}.pip>canvas.skel{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.chips{left:50%;top:18px;transform:translateX(-50%);z-index:6;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:rgba(10,23,51,.88);color:#fff;font-weight:700;font-size:16px;white-space:nowrap;max-width:560px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.chip.on{background:rgba(14,120,72,.92)}.chip.warn{background:rgba(160,100,10,.94)}
.mute{right:24px;top:20px;width:46px;height:40px;border-radius:999px;border:0;background:rgba(10,23,51,.88);color:#fff;font-size:20px;cursor:pointer;z-index:7}
/* cards */
.overlay{inset:0;z-index:20;display:none;place-items:center;background:rgba(5,11,28,.6)}.overlay.on{display:grid}
.overlay.ready{background:linear-gradient(transparent 40%,rgba(4,10,26,.9) 72%);place-items:end center;padding-bottom:18px;box-sizing:border-box}
.card{width:760px;box-sizing:border-box;padding:24px 34px 28px;border-radius:16px;background:linear-gradient(var(--navy2),var(--navy));border-top:5px solid var(--gold);color:#fff;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.card h1{margin:0 0 4px;font-size:44px;line-height:1.2;letter-spacing:0;text-transform:uppercase;font-style:italic}.card p{margin:6px 0;font-size:21px;line-height:1.4;color:#cfdcf5}.card .big{font-size:36px;font-weight:900;color:#fff}
.card h3{margin:0 0 8px;font-size:13px;color:#8fa6cf;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.card.start{width:1236px;display:grid;grid-template-columns:1.25fr 1fr 1fr auto;gap:26px;padding:16px 26px;text-align:left;align-items:stretch;border-radius:14px}
.card.start h1{font-size:30px;margin:0 0 8px}.card.start .col{display:flex;flex-direction:column;min-width:0}
.card.start .how{font-size:14px;line-height:1.45;color:#b7c8e8;margin:8px 0 0;min-height:60px}
.card.start .hint{font-size:12px;color:#8fa6cf;margin:6px 0 0}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:rgba(255,255,255,.1);align-self:flex-start}
.seg button{font:800 14px inherit;font-family:inherit;padding:7px 18px;border-radius:999px;border:0;background:transparent;color:#cfdcf5;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}.seg button.sel{background:var(--gold);color:var(--navy)}
.picks{display:flex;gap:7px;flex-wrap:nowrap}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;border:2px solid transparent;border-radius:10px;background:rgba(255,255,255,.07);cursor:pointer;font-family:inherit;width:64px;overflow:hidden;color:#fff}
.pick em{font-style:normal;font-weight:800;font-size:11px;padding:0 2px 5px;white-space:nowrap}.pick:hover{background:rgba(255,255,255,.14)}.pick.sel{border-color:var(--gold);background:rgba(232,197,71,.16)}
.av2{display:grid;place-items:center;width:100%;height:50px;background:var(--body);color:#fff;font-style:normal;position:relative;border-bottom:4px solid var(--trim)}
.av2 b{font-size:24px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.65)}
.kits{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:#8fa6cf;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kit{width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:var(--c);cursor:pointer;padding:0;opacity:.8}.kit.sel{box-shadow:0 0 0 3px var(--gold);opacity:1}
.go{align-self:center;font:900 24px "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;padding:16px 36px;border:0;border-radius:999px;background:linear-gradient(#2fd68f,#12b76a);color:#03281a;cursor:pointer;box-shadow:0 5px 0 #0b7a47;text-transform:uppercase;font-style:italic}.go:hover{filter:brightness(1.08)}.go:active{transform:translateY(3px);box-shadow:0 2px 0 #0b7a47}
.go:focus-visible,.mute:focus-visible,.pick:focus-visible,.seg button:focus-visible,.settings button:focus-visible,.kit:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card .go{margin-top:14px}
.stars{font-size:62px;color:var(--gold);line-height:1.1}.stars s{text-decoration:none;color:rgba(255,255,255,.2)}
/* teacher settings */
.settings{right:24px;top:70px;width:340px;z-index:25;display:none;padding:12px 16px;border-radius:12px;background:rgba(10,23,51,.96);color:#fff;font-size:14px;max-height:380px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}.settings.on{display:block}
.settings h3{margin:0 0 4px;font-size:15px}.settings .row{margin:6px 0;display:flex;flex-wrap:wrap;gap:5px;align-items:center}.settings label{width:100%;font-weight:700;font-size:12px;color:#8fa6cf;text-transform:uppercase;letter-spacing:.08em}
.settings button{font-weight:700;font-size:13px;font-family:inherit;padding:4px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer}.settings button.sel{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.settings button.mini{padding:0;border-radius:8px;width:44px;overflow:hidden;border:2px solid transparent;background:rgba(255,255,255,.07)}.settings button.mini .av2{height:34px}.settings button.mini .av2 b{font-size:16px}.settings button.mini.sel{border-color:var(--gold)}
.settings button.kit{width:22px;height:22px;padding:0;border:2px solid #fff}
.settings input{font:inherit;padding:4px 10px;border:1px solid rgba(255,255,255,.4);border-radius:8px;width:140px;background:rgba(255,255,255,.08);color:#fff}
@media (prefers-reduced-motion:reduce){.verdict.on{animation:none}}
</style></style>
