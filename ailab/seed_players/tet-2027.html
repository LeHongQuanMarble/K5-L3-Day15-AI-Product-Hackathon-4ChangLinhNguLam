    denied: "Ch\u01B0a cho ph\xE9p camera. D\xF9ng chu\u1ED9t: gi\u1EEF n\xFAt chu\u1ED9t = n\u1EAFm tay.",
    busy: "Camera \u0111ang \u0111\u01B0\u1EE3c d\xF9ng \u1EDF ch\u1ED7 kh\xE1c.",
    "no-camera": "Kh\xF4ng th\u1EA5y camera. D\xF9ng chu\u1ED9t: gi\u1EEF n\xFAt chu\u1ED9t = n\u1EAFm tay.",
    "model-failed": "Kh\xF4ng t\u1EA3i \u0111\u01B0\u1EE3c m\xF4 h\xECnh. V\u1EABn ch\u01A1i \u0111\u01B0\u1EE3c b\u1EB1ng b\xE0n tay.",
    off: "Camera \u0111\xE3 t\u1EAFt."
  };
  var bridge = null;
  var modelFist = false;
  var modelAt = -1e9;
  bridge = connect(window, {
    onInit: (info) => {
      game.setQuestions(info.questions);
      finished = false;
      bridge && bridge.askHands();
    },
    onResult: (key) => {
      modelFist = key === "grab";
      modelAt = performance.now();
    },
    onEmpty: () => {
    },
    onHand: (hands, available) => {
      if (!available) {
        handMode = "skin";
        paintMode();
        return;
      }
      if (handMode !== "landmarks") {
        handMode = "landmarks";
        paintMode();
      }
      lmAt = performance.now();
      useLandmarks(hands, lmAt);
    },
    onStatus: (s) => {
      status = s;
      banner = s === "ready" ? "" : BANNERS[s] || "";
      if (s === "ready") bridge.askHands();
    }
  });
  var scratch = document.createElement("canvas");
  scratch.width = VW;
  scratch.height = VH;
  var sctx = scratch.getContext("2d", { willReadFrequently: true });
  var mask = new Uint8Array(VW * VH);
  var prev = new Uint8Array(VW * VH);
  var grab = createGrab();
  var handMode = "unknown";
  var lmAt = -1e9;
  var lmGrab = createLandmarkGrab();
  function paintMode() {
    mlabel.textContent = handMode === "landmarks" ? "\u270B X\u01B0\u01A1ng tay (MediaPipe) \xB7 \u0111\u1ED9 n\u1EAFm" : handMode === "skin" ? "\u{1F3A8} D\xF2 m\xE0u da (d\u1EF1 ph\xF2ng) \xB7 \u0111\u1ED9 n\u1EAFm" : "\u23F3 \u0110ang ch\u1EDD x\u01B0\u01A1ng tay\u2026 \xB7 \u0111\u1ED9 n\u1EAFm";
  }
  function useLandmarks(hands, now) {
    const st = lmGrab.feed(hands, now);
    const p = toGame(st.x, st.y, W, H);
    camHand = { present: st.present, x: p.x, y: p.y, fist: st.fist };
    mfill.style.width = Math.round(st.score * 100) + "%";
    mfill.className = st.fist ? "on" : "";
    if (st.present) {
      dot.style.display = "block";
      dot.style.left = st.x * 100 + "%";
      dot.style.top = st.y * 100 + "%";
      dot.className = st.fist ? "dot fist" : "dot";
    } else dot.style.display = "none";
  }
  var last = null;
  var camHand = { present: false, x: W / 2, y: H / 2, fist: false };
  function look() {
    if (handMode === "landmarks") {
      if (performance.now() - lmAt > 150) useLandmarks([], performance.now());
      return;
    }
    const cam = document.querySelector("[data-jl-camera] canvas");
    if (!cam || !cam.width || status !== "ready") {
      camHand = { present: false, x: camHand.x, y: camHand.y, fist: false };
      return;
    }
    sctx.drawImage(cam, 0, 0, VW, VH);
    const px = sctx.getImageData(0, 0, VW, VH).data;
    const t = mask;
    mask = prev;
    prev = t;
    skinMask(px, VW * VH, mask);
    const blob = pickHand(findBlobs(mask, VW, VH, 25, prev), last);
    const now = performance.now();
    const st = grab.feed(blob, now);
    if (blob) {
      last = { x: blob.cx, y: blob.cy };
    } else if (!st.present) last = null;
    const model = now - modelAt < 1500;
    const p = toGame(last ? last.x : 0.5, last ? last.y : 0.5, W, H);
    camHand = { present: st.present, x: p.x, y: p.y, fist: model ? modelFist : st.fist };
    mfill.style.width = Math.round(st.score * 100) + "%";
    mfill.className = camHand.fist ? "on" : "";
    if (last) {
      dot.style.display = "block";
      dot.style.left = last.x * 100 + "%";
      dot.style.top = last.y * 100 + "%";
      dot.className = camHand.fist ? "dot fist" : "dot";
    } else dot.style.display = "none";
  }
  setInterval(look, 50);
  setTimeout(() => {
    if (handMode === "unknown") {
      handMode = "skin";
    }
    paintMode();
  }, 6e3);
  paintMode();
  document.getElementById("mtick").style.left = Math.round(FIST_ON * 100) + "%";
  var mouse = { x: W / 2, y: H / 2, down: false, at: -1e9 };
  function point(e) {
    const p = renderer.toGame(e.clientX, e.clientY);
    mouse.x = p.x;
    mouse.y = p.y;
    mouse.at = performance.now();
  }
  window.addEventListener("pointermove", point);
  window.addEventListener("pointerdown", (e) => {
    point(e);
    mouse.down = true;
  });
  window.addEventListener("pointerup", () => {
    mouse.down = false;
    mouse.at = performance.now();
  });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      mouse.down = true;
      mouse.at = performance.now();
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") mouse.down = false;
  });
  function hand(now) {
    if (now - mouse.at < 3e3 || mouse.down) return { present: true, x: mouse.x, y: mouse.y, fist: mouse.down };
    return camHand;
  }
  var snd = document.getElementById("snd");
  function paintSnd() {
    const s = state();
    snd.textContent = s === "on" ? "\u{1F50A} \xC2m thanh: b\u1EADt" : s === "muted" ? "\u{1F508} \xC2m thanh: t\u1EAFt" : s === "none" ? "" : "\u{1F507} B\u1EA5m \u0111\u1EC3 b\u1EADt \xE2m thanh";
  }
  function wake() {
    if (unlock()) startMusic();
    paintSnd();
  }
  snd.addEventListener("click", (e) => {
    e.stopPropagation();
    if (state() === "locked") {
      wake();
      return;
    }
    setMuted(!isMuted());
    paintSnd();
  });
  window.addEventListener("pointerdown", wake);
  window.addEventListener("keydown", wake);
  paintSnd();
  var lastT = 0;
  var finished = false;
  function loop(now) {
    const dt = Math.min(0.1, (now - lastT) / 1e3 || 0);
    lastT = now;
    const evs = game.update(dt, hand(now));
    for (const e of evs) {
      const s = SOUND_OF[e.type];
      if (s) sfx(s);
    }
    if (game.phase === "end" && !finished) {
      finished = true;
      bridge.finishOnce(game.summary());
    }
    if (game.phase !== "end") finished = false;
    renderer.frame({ game, banner }, dt, evs);
    gateUi.sync(game, renderer.layout());
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

</script>
</body>
