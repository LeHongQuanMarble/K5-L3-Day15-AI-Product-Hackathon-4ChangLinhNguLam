<script>
(() => {
  // src/bridge.js
  var TF = [{ key: "T", html: "\u0110\xFAng", text: "\u0110\xFAng" }, { key: "F", html: "Sai", text: "Sai" }];
  function playable(questions2) {
    const out = [];
    for (const q2 of Array.isArray(questions2) ? questions2 : []) {
      if (!q2 || q2.type !== "single" && q2.type !== "truefalse") continue;
      const choices = Array.isArray(q2.choices) && q2.choices.length ? q2.choices : q2.type === "truefalse" ? TF : [];
      if (choices.length < 2 || choices.length > 4) continue;
      if (!choices.some((c) => c.key === q2.answer)) continue;
      out.push({
        id: q2.id,
        type: q2.type,
        html: q2.html || "",
        figure: q2.figure || "",
        answer: q2.answer,
        choices: choices.map((c) => ({ key: c.key, html: c.html || c.text || c.key, text: c.text || "" }))
      });
    }
    return out;
  }
  function connect(win, hooks) {
    let finished = false;
    win.addEventListener("message", (e) => {
      const d = e && e.data;
      if (!d || typeof d !== "object" || e.source !== win.parent) return;
      if (d.type === "camera.init") {
        finished = false;
        const raw = Array.isArray(d.questions) ? d.questions : Array.isArray(d.content) ? d.content : [];
        const qs = playable(raw);
        hooks.onInit({
          locale: d.locale === "en" ? "en" : "vi",
          mode: d.mode === "setup" ? "setup" : "play",
          source: d.source === "mic" ? "mic" : "camera",
          options: d.options,
          inputs: Array.isArray(d.inputs) ? d.inputs : [],
          questions: qs,
          skipped: raw.length - qs.length
        });
      } else if (d.type === "camera.result") hooks.onResult(String(d.input || ""), Number(d.confidence) || 0);
      else if (d.type === "camera.empty") hooks.onEmpty();
      else if (d.type === "camera.frame") hooks.onFrame(d.scores && typeof d.scores === "object" ? d.scores : {});
      else if (d.type === "camera.status") hooks.onStatus(String(d.state || ""), d.source === "mic" ? "mic" : "camera");
      else if (d.type === "camera.hand") hooks.onHand(Array.isArray(d.hands) ? d.hands : [], d.available !== false);
      else if (d.type === "camera.speech") hooks.onSpeech({ text: typeof d.text === "string" ? d.text : "", final: d.final !== false, available: d.available !== false, error: typeof d.error === "string" ? d.error : "" });
    });
    win.parent.postMessage({ type: "ready" }, "*");
    return {
      listen(on, lang) {
        win.parent.postMessage(on ? { type: "speech", on: true, lang } : { type: "speech", on: false }, "*");
      },
      askHands(on) {
        win.parent.postMessage({ type: "hands", on: on !== false }, "*");
      },
      saveOptions(options2) {
        win.parent.postMessage({ type: "options.change", options: options2 }, "*");
      },
      finish(summary2) {
        if (finished) return;
        finished = true;
        win.parent.postMessage({ type: "finish", correct: summary2.correct, total: summary2.total }, "*");
      },
      again() {
        finished = false;
      }
    };
  }

  // src/zones.js
  var COURT_W = 6.1;
  var COURT_L = 13.4;
  var NET_H = 1.55;
  var KEYS = ["A", "B", "C", "D"];
  function layout(n) {
    const k = Math.min(4, Math.max(2, n | 0));
    const cols = k === 4 ? 2 : k;
    const rows = k === 4 ? 2 : 1;
    const cells = [];
    for (let i = 0; i < k; i++) cells.push({ i, col: i % cols, row: Math.floor(i / cols) });
    return { n: k, cols, rows, cells };
  }
  function zoneCentre(lay, i, half) {
    const c = lay.cells[i];
    const w = (COURT_W - 0.5) / lay.cols;
    const x = (c.col + 0.5) * w - (COURT_W - 0.5) / 2;
    if (lay.rows === 1) return [x, half === "far" ? -3.6 : 3.6, w, 5.6];
    const d = 2.7;
    const rows = half === "far" ? [-5.3, -2.3] : [2.3, 5.3];
    return [x, rows[c.row], w, d];
  }
  function indexOfKey(q2, key) {
    const k = String(key || "").toUpperCase();
    const byKey = q2.choices.findIndex((c) => c.key === k);
    if (byKey >= 0) return byKey;
    const at = KEYS.indexOf(k);
    return at >= 0 && at < q2.choices.length ? at : -1;
  }

  // src/rally.js
