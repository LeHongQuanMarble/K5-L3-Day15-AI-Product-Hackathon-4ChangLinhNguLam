<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giải cứu thế giới</title>
<script type="application/json" id="jl-camera">
{"name":"Giải cứu thế giới","description":"Trả lời A, B, C, D (bằng giọng nói, giơ tay hoặc tư thế) để chạy qua ải và cứu thế giới.","kinds":["image","pose","audio"],"questions":"exam","questionTypes":["single"],
 "inputs":[{"key":"A","label":"A","required":true,"accepts":["action"]},{"key":"B","label":"B","required":true,"accepts":["action"]},
           {"key":"C","label":"C","required":true,"accepts":["action"]},{"key":"D","label":"D","required":true,"accepts":["action"]}]}
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1530;color:#fff;font-family:ui-monospace,"Cascadia Mono","Courier New",monospace;font-weight:700}
#app{position:fixed;inset:0}
.stage{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
/* block-game look: square bevelled panels, white text with a hard dark shadow */
.qbox,.ans,.slot,.banner,.msg,.bossbar .bar,.xp{box-sizing:border-box}
.qbox,.msg,.banner{background:rgba(16,16,16,.9);outline:2px solid #000;box-shadow:inset 0 0 0 2px #555}
.qbox,.ans .choice,.msg,.banner,.hud,.heard,.bossbar .name,.story,.end{text-shadow:2px 2px 0 #3f3f3f}
/* top: question and the four answers as a menu */
.top{position:absolute;left:12px;right:12px;top:44px;max-height:36%;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.qbox{flex:0 1 auto;min-height:0;max-height:16vh;overflow:auto;padding:8px 14px;font-size:clamp(14px,2.4vw,24px);line-height:1.35}
.qbox p{margin:0 0 .4em}.qbox img{max-width:100%;max-height:10vh}
.answers{flex:0 1 auto;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:2px}
.ans{position:relative;display:flex;align-items:center;gap:10px;padding:4px 10px;background:#707070;outline:2px solid #000;box-shadow:inset 2px 2px 0 #a8a8a8,inset -2px -2px 0 #3c3c3c;color:#e0e0e0}
.ans .badge{flex:none;display:grid;place-items:center;width:clamp(26px,4.2vh,36px);height:clamp(26px,4.2vh,36px);background:#8b8b8b;box-shadow:inset 2px 2px 0 #c6c6c6,inset -2px -2px 0 #555;color:#fff;font-size:clamp(14px,2.4vh,20px);text-shadow:2px 2px 0 #3f3f3f}
.ans .choice{font-size:clamp(13px,2.1vw,21px);line-height:1.25}
.ans .meter{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.45)}.ans .meter i{display:block;height:100%;background:#7efc20;transition:width .1s linear}
.ans.hearing{color:#fff;box-shadow:inset 2px 2px 0 #c6c6c6,inset -2px -2px 0 #3c3c3c,inset 0 0 0 4px rgba(126,252,32,.55)}
.ans.picked{outline-color:#fff;color:#ffffa0}
.ans.right{background:#4f9a3a;box-shadow:inset 2px 2px 0 #8fd37a,inset -2px -2px 0 #2a5a1c;color:#fff}
.ans.wrong{background:#a23b3b;box-shadow:inset 2px 2px 0 #de8080,inset -2px -2px 0 #5c1c1c;color:#fff}
.ans.gone{opacity:.3}
@media (max-width:640px){.answers{grid-template-columns:1fr;gap:4px}.ans{padding:2px 8px}.ans .choice{font-size:12px}}
/* boss bar under the top edge, like a boss fight */
.bossbar{position:absolute;left:12px;right:12px;top:6px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.bossbar .name{font-size:13px}
.bossbar .bar{width:min(100%,360px);height:10px;background:#222;outline:2px solid #000}
.bossbar .fill,.xp .fill{height:100%}
.bossbar .fill{background:#c040c0;box-shadow:inset 0 3px 0 #e684e6}
/* bottom: hearts, level number, experience bar, hotbar */
.hud{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:stretch;gap:2px;pointer-events:none}
.hearts{display:flex;gap:2px;font-size:22px;line-height:1}
.heart.full{color:#f21313;text-shadow:2px 2px 0 #4a0000,-1px -1px 0 #000}.heart.empty{color:#4a1a1a;text-shadow:1px 1px 0 #000}
.level{align-self:center;color:#80ff20;font-size:15px;line-height:1;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.xp{height:10px;background:#2a2a2a;outline:2px solid #000}.xp .fill{background:#7efc20;box-shadow:inset 0 3px 0 #b8ff80;width:0%}
.hotbar{display:flex;background:#8b8b8b;outline:2px solid #000;box-shadow:inset 2px 2px 0 #c6c6c6,inset -2px -2px 0 #555}
.slot{position:relative;width:48px;height:48px;display:grid;place-items:center;box-shadow:inset 2px 2px 0 #555,inset -2px -2px 0 #c6c6c6;margin:2px}
.slot .icon{font-size:22px;line-height:1}
.slot .label{position:absolute;right:3px;bottom:1px;font-size:11px;line-height:1;color:#fff;text-shadow:1px 1px 0 #000}
.slot.selected{outline:3px solid #fff;z-index:1;background:#a8a8a8}
.slot[data-slot=coins] .icon{color:#ffd54f}
.heard{position:absolute;left:12px;bottom:calc(12px + clamp(110px,16vw,190px) * 0.75 + 8px);padding:2px 8px;background:rgba(0,0,0,.55);font-size:15px}
.heard:empty{display:none}
@media (max-width:640px){.hud{left:auto;right:8px;transform:none}.slot{width:38px;height:38px}.slot .icon{font-size:18px}.hearts{font-size:18px}.heard{bottom:calc(12px + 110px * 0.75 + 8px)}}
/* toast, notices, story, endings */
.banner{position:absolute;right:12px;top:42%;display:flex;gap:10px;align-items:center;max-width:300px;padding:8px 12px;z-index:3;animation:toast .35s ease-out}
@keyframes toast{from{transform:translateX(120%)}to{transform:none}}
.banner .icon{flex:none;display:grid;place-items:center;width:40px;height:40px;font-size:24px;background:#8b8b8b;box-shadow:inset 2px 2px 0 #c6c6c6,inset -2px -2px 0 #555}
.banner .title{display:block;color:#ffff55;font-size:12px}.banner .line{display:block;font-size:14px;line-height:1.25}
.msg{position:absolute;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100% - 32px);top:55%;transform:translateY(-50%);padding:14px 20px;font-size:clamp(15px,2.6vw,22px);text-align:center;z-index:4}
.story,.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
.story{z-index:7;background-color:#3b2a1a;background-image:linear-gradient(45deg,#2f2013 25%,transparent 25%,transparent 75%,#2f2013 75%),linear-gradient(45deg,#2f2013 25%,transparent 25%,transparent 75%,#2f2013 75%);background-size:32px 32px;background-position:0 0,16px 16px}
.story-line{font-size:clamp(18px,3.6vw,30px);line-height:1.4;max-width:720px}
.story-next,.story-next:visited{font:inherit;font-size:clamp(16px,2.6vw,22px);padding:8px 40px;border:0;cursor:pointer;color:#e0e0e0;background:#707070;outline:2px solid #000;box-shadow:inset 2px 2px 0 #a8a8a8,inset -2px -2px 0 #3c3c3c;text-shadow:2px 2px 0 #3f3f3f}
.story-next:hover,.story-next:focus-visible{outline-color:#fff;color:#ffffa0}
.end{z-index:6;background:rgba(10,18,45,.9)}
.end.win{background:rgba(20,70,20,.88)}.end.lose{background:rgba(110,10,10,.85)}
.end-title{font-size:clamp(24px,5.4vw,44px)}.end.win .end-title{color:#ffff55}.end-sub{font-size:clamp(16px,3.6vw,26px)}.end-score{font-size:clamp(14px,3vw,22px);margin-top:6px}
/* level meter for a microphone model, in the same corner as the camera picture */
.vu{position:fixed;left:12px;bottom:12px;width:clamp(110px,16vw,190px);aspect-ratio:4/3;z-index:6;display:flex;align-items:stretch;gap:6px;padding:8px 8px 4px;background:rgba(16,16,16,.92);outline:2px solid #000;box-shadow:inset 0 0 0 2px #555}
.vubar{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(255,255,255,.08)}
.vubar i{display:block;width:100%;background:linear-gradient(0deg,#7efc20 0%,#7efc20 55%,#ffd23f 75%,#ff3b3b 100%);background-size:100% 100%;transition:height .08s linear}
.vubar span{align-self:center;font-size:12px;line-height:1.4;color:#fff;text-shadow:1px 1px 0 #000}
[hidden]{display:none!important}
.mic{position:fixed;left:12px;bottom:12px;width:clamp(110px,16vw,190px);aspect-ratio:4/3;z-index:5;overflow:hidden;background:rgba(0,0,0,.5);outline:2px solid #000}
.mic canvas{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div data-jl-camera class="mic"></div>
<div id="app"></div>
<script>(() => {
  // src/logic.js
  var WORLD_NAMES = ["R\u1EEBng", "Bi\u1EC3n", "Sa m\u1EA1c"];
  var CASTLE = "L\xE2u \u0111\xE0i";
  var KEYS = ["A", "B", "C", "D"];
  var GAP_MAX = 3;
  function planWorlds(n) {
    if (n <= 0) return [];
    if (n < 3) return [{ name: CASTLE, count: n, boss: n }];
    const worlds = Math.min(4, Math.floor(n / 3));
    const base = Math.floor(n / worlds);
    const extra = n % worlds;
    return Array.from({ length: worlds }, (_, i) => {
      const count = base + (i < extra ? 1 : 0);
      return { name: i === worlds - 1 ? CASTLE : WORLD_NAMES[i], count, boss: Math.min(3, count) };
    });
  }
  function forkSeconds(combo, slow = false) {
    return Math.max(5, 8 - 0.5 * combo) + (slow ? 3 : 0);
  }
  function createRun(questions, opts = {}) {
    var _a;
    const rand = opts.rand || Math.random;
    const worlds = planWorlds(questions.length);
    const startOf = [];
    worlds.reduce((at, w, i) => {
      startOf[i] = at;
      return at + w.count;
    }, 0);
    const startHearts = (_a = opts.hearts) != null ? _a : 3;
    let idx = 0, hearts = startHearts, combo = 0, gap = GAP_MAX, correct = 0, rescued = 0;
    let shield = false, slowNext = false, fiftyNext = false, over = false;
    let hidden = [];
    const boss = worlds.map(() => ({ right: 0 }));
    const rescuedAt = [];
    const worldOf = (i) => {
      let w = 0;
      while (w + 1 < worlds.length && i >= startOf[w + 1]) w++;
      return w;
    };
    const inBoss = (i) => {
      const w = worldOf(i);
      return i - startOf[w] >= worlds[w].count - worlds[w].boss;
    };
    function enter() {
      hidden = [];
      if (fiftyNext && idx < questions.length) {
        fiftyNext = false;
        const wrong = questions[idx].choices.map((c) => c.key).filter((k) => k !== questions[idx].answer);
        while (hidden.length < 2 && wrong.length) hidden.push(wrong.splice(Math.floor(rand() * wrong.length), 1)[0]);
      }
    }
    return {
      current() {
        if (over || idx >= questions.length) return null;
        const w = worldOf(idx), isBoss = inBoss(idx);
        return { q: questions[idx], world: w, inBoss: isBoss, boss: isBoss ? { hits: boss[w].right, total: worlds[w].boss } : null, hidden, slow: slowNext };
      },
      answer(key) {
        const cur = this.current();
        if (!cur || key !== null && !KEYS.includes(key)) return { kind: "ignored" };
        let kind, shielded = false, award = null, caught = false, worldDone = null;
        if (key === cur.q.answer) {
          kind = "ok";
          combo++;
          correct++;
          gap = Math.min(GAP_MAX, gap + 0.5);
          if (cur.inBoss) boss[cur.world].right++;
          if (combo === 3 && !shield) {
            shield = true;
            award = "shield";
          } else if (combo === 5) {
            slowNext = true;
            award = "slow";
          } else if (combo === 7) {
            fiftyNext = true;
            award = "fifty";
          }
        } else if (key === null) {
          kind = "silent";
          combo = 0;
          gap -= 0.5;
        } else {
          kind = "wrong";
          combo = 0;
          if (shield) {
            shield = false;
            shielded = true;
          } else gap -= 1;
        }
        if (cur.slow) slowNext = false;
        if (gap <= 0) {
          caught = true;
          hearts--;
          gap = GAP_MAX;
        }
        if (hearts <= 0) over = true;
        const w = worlds[cur.world];
        if (idx === startOf[cur.world] + w.count - 1) {
          const rescuedIt = boss[cur.world].right >= Math.ceil(w.boss * 2 / 3);
          if (rescuedIt) {
            rescued++;
            rescuedAt[cur.world] = true;
          }
          worldDone = { index: cur.world, rescued: rescuedIt, last: cur.world === worlds.length - 1 };
        }
        idx++;
        enter();
        return { kind, shielded, hearts, combo, gap, award, caught, worldDone, over };
      },
      nextWorld() {
        return worldOf(Math.min(idx + 1, Math.max(0, questions.length - 1)));
      },
      heal() {
        if (hearts > 0 && hearts < startHearts) hearts++;
        return hearts;
      },
      summary() {
        const last2 = worlds.length - 1;
        const princess = last2 >= 0 && !!rescuedAt[last2];
        return { correct, total: questions.length, hearts, rescued, worlds: worlds.length, princess, keys: rescued - (princess ? 1 : 0) };
      }
    };
  }

  // src/bridge.js
  var ABCD = "ABCD";
  function filterPlayable(questions) {
    const playable = (questions || []).filter((q) => q && q.type === "single" && Array.isArray(q.choices) && q.choices.map((c) => c.key).join("") === ABCD);
    return { playable, skipped: (questions || []).length - playable.length };
  }
  function connect(win, hooks) {
    let finished = false;
    function finishOnce(summary) {
      if (finished) return;
      finished = true;
      win.parent.postMessage({ type: "finish", correct: summary.correct, total: summary.total }, "*");
    }
    win.addEventListener("message", (e) => {
      const d = e && e.data;
      if (!d || typeof d !== "object" || e.source !== win.parent) return;
      if (d.type === "camera.init") {
        const { playable, skipped } = filterPlayable(d.questions);
        const run = createRun(playable);
        finished = false;
        hooks.onInit(run, { skipped, locale: d.locale === "en" ? "en" : "vi", source: d.source === "mic" ? "mic" : "camera" });
        if (playable.length === 0) finishOnce(run.summary());
      } else if (d.type === "camera.result") hooks.onResult(d.input);
      else if (d.type === "camera.status") hooks.onStatus(d.state, d.source);
      else if (d.type === "camera.frame" && hooks.onFrame) hooks.onFrame(d.scores || {});
    });
    win.parent.postMessage({ type: "ready" }, "*");
    return { send: (m) => win.parent.postMessage(m, "*"), finishOnce };
  }

  // src/story.js
  var INTRO = [
    "Vua B\xF3ng T\u1ED1i \u0111\xE3 b\u1EAFt C\xF4ng ch\xFAa M\xE2y v\xE0 nh\u1ED1t trong l\xE2u \u0111\xE0i.",
    "Th\u1EBF gi\u1EDBi m\u1EA5t h\u1EBFt m\xE0u s\u1EAFc.",
    "Hi\u1EC7p s\u0129 Bi l\xEAn \u0111\u01B0\u1EDDng! Tr\u1EA3 l\u1EDDi \u0111\xFAng \u0111\u1EC3 v\u01B0\u1EE3t qua m\u1ECDi th\u1EED th\xE1ch."
  ];
  var ENDING_WIN = ["C\xF4ng ch\xFAa M\xE2y \u0111\u01B0\u1EE3c c\u1EE9u!", "Th\u1EBF gi\u1EDBi l\xEAn m\xE0u tr\u1EDF l\u1EA1i."];
  var ENDING_LOSE = ["C\xF4ng ch\xFAa v\u1EABn \u0111ang ch\u1EDD.", "H\xE3y th\u1EED l\u1EA1i nh\xE9!"];
  var keyLine = (name) => `Bi l\u1EA5y \u0111\u01B0\u1EE3c Ch\xECa kh\xF3a ${name}!`;
  var EN_WORLD = { "R\u1EEBng": "Forest", "Bi\u1EC3n": "Sea", "Sa m\u1EA1c": "Desert", "L\xE2u \u0111\xE0i": "Castle" };
  var EN = {
    intro: ["The Dark King has captured Princess M\xE2y and locked her in his castle.", "The world has lost its colours.", "Knight Bi sets off! Answer right to get past every challenge."],
    win: ["Princess M\xE2y is free!", "The colours are back."],
    lose: ["The princess is still waiting.", "Try again!"],
    keyLine: (name) => `Bi found the ${EN_WORLD[name] || name} Key!`
  };
  var VI = { intro: INTRO, win: ENDING_WIN, lose: ENDING_LOSE, keyLine };
  var forLocale = (locale) => locale === "en" ? EN : VI;

  // src/ui.js
  var KEYS2 = ["A", "B", "C", "D"];
  var SLOTS = [["shield", "\u{1F6E1}", "Khi\xEAn"], ["slow", "\u23F3", "Ch\u1EADm"], ["fifty", "\u{1F52E}", "50:50"]];
  var MAX_HEARTS = 3;
  var STATUS_TEXT = {
    loading: "\u0110ang b\u1EADt micro\u2026",
    denied: "Ch\u01B0a cho ph\xE9p micro. H\xE3y b\u1EA5m Cho ph\xE9p tr\xEAn tr\xECnh duy\u1EC7t.",
    "no-camera": "Kh\xF4ng t\xECm th\u1EA5y micro.",
    "model-failed": "Kh\xF4ng t\u1EA3i \u0111\u01B0\u1EE3c m\xF4 h\xECnh. H\xE3y t\u1EA3i l\u1EA1i trang.",
    off: "Micro \u0111\xE3 t\u1EAFt. B\u1EADt l\u1EA1i \u0111\u1EC3 ch\u01A1i ti\u1EBFp.",
    busy: "Micro \u0111ang \u0111\u01B0\u1EE3c d\xF9ng \u1EDF n\u01A1i kh\xE1c."
  };
  function createUi(root2, locale = "vi") {
    const doc = root2.ownerDocument;
    const mk = (cls, text) => {
      const n = doc.createElement("div");
      if (cls) n.setAttribute("class", cls);
      if (text != null) n.textContent = text;
      return n;
    };
    const hide = (n) => n.setAttribute("hidden", "");
    const show = (n) => n.removeAttribute("hidden");
    const hud = mk("hud");
    const heartsRow = mk("hearts"), level = mk("level", "0"), xp = mk("xp"), xpFill = mk("fill"), hotbar = mk("hotbar");
    xp.appendChild(xpFill);
    [heartsRow, level, xp, hotbar].forEach((n) => hud.appendChild(n));
    const bossbar = mk("bossbar");
    const bossName = mk("name"), bossBarBg = mk("bar"), bossFill = mk("fill");
    bossBarBg.appendChild(bossFill);
    bossbar.appendChild(bossName);
    bossbar.appendChild(bossBarBg);
    hide(bossbar);
    const qbox = mk("qbox");
    const answers = mk("answers");
    const rows = KEYS2.map((k) => {
      const r = mk("ans");
      r.setAttribute("data-key", k);
      answers.appendChild(r);
      return r;
    });
    const board = mk("top");
    board.appendChild(qbox);
    board.appendChild(answers);
    const vu = mk("vu");
    hide(vu);
    const vuBars = KEYS2.map((k) => {
      const b = mk("vubar");
      b.setAttribute("data-key", k);
      b.innerHTML = '<i style="height:0%"></i><span>' + k + "</span>";
      vu.appendChild(b);
      return b;
    });
    const heardBox = mk("heard");
    const msg = mk("msg");
    msg.setAttribute("role", "status");
    msg.setAttribute("aria-live", "polite");
    hide(msg);
    const banner = mk("banner");
    hide(banner);
    const storyBox = mk("story");
    hide(storyBox);
    const end = mk("end");
    hide(end);
    [board, bossbar, hud, vu, heardBox, banner, msg, storyBox, end].forEach((n) => root2.appendChild(n));
    let active = null;
    const stopStory = () => {
      if (active) {
        active.stop();
        active = null;
      }
    };
    const row = (k) => rows[KEYS2.indexOf(k)];
    const texts = () => forLocale(locale);
    return {
      setLocale(l) {
        locale = l === "en" ? "en" : "vi";
      },
      /** 'mic' shows the level meter; 'camera' (an image or pose model) leaves the camera picture the page draws. */
      setSource(kind) {
        if (kind === "mic") show(vu);
        else hide(vu);
      },
      /** Back to an empty board: a new run must never play under an old ending or story. */
      reset() {
        stopStory();
        qbox.innerHTML = "";
        rows.forEach((r) => {
          r.setAttribute("class", "ans");
          r.innerHTML = "";
        });
        heardBox.textContent = "";
        xpFill.setAttribute("style", "width:0%");
        hide(end);
        hide(storyBox);
        hide(banner);
        hide(msg);
        hide(bossbar);
        hide(vu);
      },
      showQuestion(html, choices, hidden = []) {
        qbox.innerHTML = html;
        rows.forEach((r, i) => {
          const c = choices.find((x) => x.key === KEYS2[i]);
          r.setAttribute("class", "ans" + (hidden.includes(KEYS2[i]) ? " gone" : ""));
          r.innerHTML = '<span class="badge">' + KEYS2[i] + '</span><span class="choice">' + (c ? c.html : "") + '</span><span class="meter"><i style="width:0%"></i></span>';
        });
        heardBox.textContent = "";
        xpFill.setAttribute("style", "width:0%");
      },
      /** What the audio model hears right now: a bar on each answer, and the one it is sure of (>= 50%) is marked. null clears it. */
      live(scores) {
        let best = null, top = 0.5;
        KEYS2.forEach((k) => {
          const v = scores && scores[k] > 0 ? Math.min(1, scores[k]) : 0;
          if (v >= top) {
            best = k;
            top = v;
          }
        });
        rows.forEach((r, i) => {
          const v = scores && scores[KEYS2[i]] > 0 ? Math.min(1, scores[KEYS2[i]]) : 0;
          const bar = r.querySelector(".meter i");
          if (bar) bar.setAttribute("style", "width:" + Math.round(v * 100) + "%");
          if (KEYS2[i] === best) r.classList.add("hearing");
          else r.classList.remove("hearing");
          vuBars[i].querySelector("i").setAttribute("style", "height:" + Math.round(v * 100) + "%");
        });
      },
