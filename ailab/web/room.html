<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phòng chơi — AI Lab</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/style.css">
<style>
body{margin:0;background:var(--jl-au-ground);color:var(--jl-text-default)}
.rm{max-width:720px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}
.rm h1{margin:0;font-size:1.4rem}
.rm .card{background:var(--jl-surface-default);border:1px solid var(--jl-au-hair);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rm .code{font-size:2.6rem;font-weight:700;letter-spacing:.3em;font-family:ui-monospace,monospace;text-align:center}
.rm .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rm input{flex:1;min-width:140px;padding:10px 12px;border-radius:8px;border:1px solid var(--jl-border-strong);background:var(--jl-surface-default);color:inherit;font:inherit}
.rm ol,.rm ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.rm li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--jl-au-soft)}
.rm li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm li.me{outline:2px solid var(--jl-brand-600)}
.rm .muted{color:var(--jl-text-secondary);font-size:.9rem}
.rm .err{color:#c0392b}
[hidden]{display:none!important}
</style></head>
<body><div class="rm" id="root"><p class="muted">Đang nạp…</p></div><script src="/room.js"></script></body></html>
